name: "Semantic Pull Request"
# @see https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs
permissions:
  actions: none
  checks: none
  # to check out & read the repository
  contents: read
  deployments: none
  id-token: none
  issues: none
  discussions: none
  packages: none
  pages: none
  # to read pull-request data, including commits/issues linked
  pull-requests: read
  repository-projects: none
  security-events: none
  statuses: none
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
    branches:
      - develop
      - release/*
      - 'v[0-9]+'

jobs:
  main:
    name: Semantic Pull Request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/github-actions/semantic-pull-request
            scripts/semantic-commits
      - run: npm install --ignore-scripts
        working-directory: scripts/github-actions/semantic-pull-request/
      - name: Lint PR Title and Cypress Changelog Entry
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const verifyPullRequest = require('./scripts/github-actions/semantic-pull-request')

            await verifyPullRequest({ context, core, github })
