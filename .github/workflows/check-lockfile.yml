name: Check Lockfile
# Neither check reads build output, so this runs on a bare checkout rather than
# alongside the CircleCI jobs that need the built workspace.
permissions:
  contents: read
on:
  pull_request:
    branches:
      - develop
      - release/*
  push:
    branches:
      - develop
      - release/*
      - electron/*

concurrency:
  group: check-lockfile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-lockfile:
    name: Check Lockfile
    runs-on: ubuntu-latest
    # Fork PRs wait for a maintainer to approve the run. The event-name guard
    # carries weight: `push` payloads have no pull_request, so the repository
    # comparison on its own would also gate every develop and release push.
    environment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'fork-pr-review' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: yarn
      # Must precede anything that installs: this diffs the committed yarn.lock
      # against a fresh resolution, so an earlier install would rewrite its
      # baseline and turn real drift into a silent pass. Passing also leaves
      # node_modules in place for the deduplication check below.
      - name: Check yarn.lock matches resolved dependencies 🔒
        run: yarn check-lockfile-drift
        env:
          # Set here rather than in the script, which contributors run locally.
          YARN_NETWORK_TIMEOUT: 300000
      - name: Check yarn.lock is deduplicated 🧬
        run: |
          if ! yarn check-lockfile; then
            echo ""
            echo "yarn.lock has duplicates that the local postinstall would collapse on its own,"
            echo "so the committed lockfile does not match the tree contributors actually install."
            echo "Run 'yarn-deduplicate --strategy=highest' and commit the resulting yarn.lock."
            exit 1
          fi
