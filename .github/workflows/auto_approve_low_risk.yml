name: 'Auto-approve low-risk PRs'

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
    branches:
      - develop
      - release/*

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: auto-approve-low-risk-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-approve:
    name: Auto-approve low-risk PR
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'cypress-io/cypress' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Extract risk level from CURSOR_SUMMARY
        id: risk-check
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.pull_request.body || '';

            const summaryMatch = body.match(/<!-- CURSOR_SUMMARY -->([\s\S]*?)<!-- \/CURSOR_SUMMARY -->/);
            if (!summaryMatch) {
              core.notice('No CURSOR_SUMMARY section found in PR body.');
              core.setOutput('is_low_risk', 'false');
              return;
            }

            const summaryContent = summaryMatch[1];

            const hasMediumRisk = /\*\*Medium Risk\*\*/i.test(summaryContent);
            const hasHighRisk = /\*\*High Risk\*\*/i.test(summaryContent);

            if (hasMediumRisk || hasHighRisk) {
              core.notice('PR is not low risk.');
              core.setOutput('is_low_risk', 'false');
              return;
            }

            const hasLowRisk = /\*\*Low Risk\*\*/i.test(summaryContent);
            if (!hasLowRisk) {
              core.notice('No recognized risk level found in CURSOR_SUMMARY.');
              core.setOutput('is_low_risk', 'false');
              return;
            }

            core.info('CURSOR_SUMMARY contains **Low Risk** assessment.');
            core.setOutput('is_low_risk', 'true');

      - name: Find existing auto-approval
        id: existing-approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          REVIEW_ID=$(gh api --paginate \
            "/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews" \
            --jq '.[] | select(.user.login == "cypress-bot[bot]" and .state == "APPROVED" and (.body // "" | startswith("Auto-approved:"))) | .id' \
            | tail -n 1)

          if [ -n "$REVIEW_ID" ]; then
            echo "review_id=$REVIEW_ID" >> "$GITHUB_OUTPUT"
            echo "::notice::Found existing auto-approval (review #$REVIEW_ID)."
          else
            echo "review_id=" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide reconciliation action
        id: action
        env:
          EVENT_ACTION: ${{ github.event.action }}
          IS_LOW_RISK: ${{ steps.risk-check.outputs.is_low_risk }}
          REVIEW_ID: ${{ steps.existing-approval.outputs.review_id }}
        run: |
          # On synchronize (new commits), force-dismiss any prior auto-approval so
          # BugBot must re-review the new head SHA before re-approval can fire.
          if [ "$EVENT_ACTION" = "synchronize" ] && [ -n "$REVIEW_ID" ]; then
            echo "action=dismiss" >> "$GITHUB_OUTPUT"
            echo "dismiss_reason=New commits pushed. Auto-approval dismissed pending Cursor Bugbot re-review of the new head SHA." >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_ACTION" = "synchronize" ]; then
            echo "action=noop" >> "$GITHUB_OUTPUT"
          elif [ "$IS_LOW_RISK" = "true" ] && [ -z "$REVIEW_ID" ]; then
            echo "action=approve" >> "$GITHUB_OUTPUT"
          elif [ "$IS_LOW_RISK" = "false" ] && [ -n "$REVIEW_ID" ]; then
            echo "action=dismiss" >> "$GITHUB_OUTPUT"
            echo "dismiss_reason=Cursor Bugbot risk assessment is no longer **Low Risk**. Auto-approval dismissed; manual review required." >> "$GITHUB_OUTPUT"
          else
            echo "action=noop" >> "$GITHUB_OUTPUT"
            echo "::notice::No reconciliation needed (event=$EVENT_ACTION, is_low_risk=$IS_LOW_RISK, has_existing_approval=$([ -n "$REVIEW_ID" ] && echo true || echo false))."
          fi

      - name: Require BugBot review on current head SHA
        if: steps.action.outputs.action == 'approve'
        id: bugbot-head-review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eo pipefail
          REVIEWED=$(gh api --paginate \
            "/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews" \
            --jq ".[] | select(.user.login == \"cursor[bot]\" and .commit_id == \"$HEAD_SHA\") | .id" \
            | wc -l | tr -d ' ')

          if [ "$REVIEWED" -eq 0 ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::BugBot has not reviewed head SHA $HEAD_SHA yet. Skipping approval."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Cypress Bot App token
        if: steps.action.outputs.action == 'approve' || steps.action.outputs.action == 'dismiss'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CYPRESS_BOT_APP_ID }}
          private-key: ${{ secrets.CYPRESS_BOT_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-metadata: read

      - name: Verify PR author has write access
        if: steps.action.outputs.action == 'approve'
        id: author-check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          PERMISSION=$(gh api \
            "/repos/${{ github.repository }}/collaborators/$AUTHOR_LOGIN/permission" \
            --jq '.permission')

          case "$PERMISSION" in
            admin|write)
              echo "has_write=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "has_write=false" >> "$GITHUB_OUTPUT"
              echo "::notice::PR author '$AUTHOR_LOGIN' has '$PERMISSION' permission. Skipping auto-approve."
              ;;
          esac

      - name: Approve PR
        if: >-
          steps.action.outputs.action == 'approve' &&
          github.event.sender.type == 'Bot' &&
          github.event.sender.login == 'cursor[bot]' &&
          steps.bugbot-head-review.outputs.ok == 'true' &&
          steps.author-check.outputs.has_write == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews" \
            -f event="APPROVE" \
            -f body="Auto-approved: Cursor Bugbot assessed this PR as **Low Risk**."

      - name: Dismiss stale approval
        if: steps.action.outputs.action == 'dismiss'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api \
            --method PUT \
            "/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews/${{ steps.existing-approval.outputs.review_id }}/dismissals" \
            -f message="${{ steps.action.outputs.dismiss_reason }}"
