<!DOCTYPE html>
<html lang="en">
<head>
</head>
<body>
  <script>
    // Reproduces https://github.com/cypress-io/cypress/issues/26029:
    // clicking the button dynamically creates a form, sets target="_top",
    // and submits it programmatically via form.submit() — which does NOT
    // dispatch a `submit` event, so it bypasses the capture-phase guard.
    function submitDynamicForm () {
      const form = document.createElement('form')

      form.method = 'GET'
      form.action = '/fixtures/dom.html'
      form.target = '_top'

      document.body.appendChild(form)
      form.submit()
    }
  </script>

  <button id="submit" onclick="submitDynamicForm()">Submit</button>
</body>
</html>
