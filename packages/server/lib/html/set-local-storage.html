<html>
  <body>
    <script>
      // the origin of the embedding document, when it is the runner's; the driver
      // replies from the runner's top window, so only messages from that origin apply
      const parentOrigin = {{parentOrigin | safe}}

      if (parentOrigin) {
        window.onmessage = function (event) {
          if (event.origin !== parentOrigin) return

          const msg = event.data

          if (msg.type === 'set:storage:data') {
            const { data } = msg

            const setData = (storageData, type) => {
              if (!storageData) return

              const { clear, value } = storageData

              if (clear) {
                window[type].clear()
              }

              if (value) {
                Object.keys(value).forEach((key) => {
                  window[type].setItem(key, value[key])
                })
              }
            }

            setData(data.localStorage, 'localStorage')
            setData(data.sessionStorage, 'sessionStorage')

            window.parent.postMessage({ type: 'set:storage:complete' }, parentOrigin)
          }
        }

        window.parent.postMessage({ type: 'set:storage:load' }, parentOrigin)
      }
    </script>
  </body>
</html>
