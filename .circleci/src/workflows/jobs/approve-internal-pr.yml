resource_class: small
docker:
  - image: cimg/node:current
steps:
  - run:
      name: Internal PR - Run Approved
      command: |
        if [ << pipeline.parameters.is_contributor_pr >> ]; then
          echo "External PR - manual approval required."
          exit 0
        fi

        # Get all jobs in the current workflow
        curl -H "Circle-Token: $CIRCLE_TOKEN" \
          "https://circleci.com/api/v2/workflow/$CIRCLE_WORKFLOW_ID/job"

        # Parse the response to find the approve-contributor-pr job ID
        JOB_ID=$(curl -s -H "Circle-Token: $CIRCLE_TOKEN" \
          "https://circleci.com/api/v2/workflow/$CIRCLE_WORKFLOW_ID/job" | \
          jq -r '.items[] | select(.name == "approve-contributor-pr") | .id')

        # Then approve it
        curl -X POST \
          -H "Circle-Token: $CIRCLE_TOKEN" \
          "https://circleci.com/api/v2/workflow/$CIRCLE_WORKFLOW_ID/approve/$JOB_ID"
