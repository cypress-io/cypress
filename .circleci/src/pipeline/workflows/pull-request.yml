# The workflow runs for:
# External PR after approval (approved contributor PR that's not a main branch)
# Internal PR for any branch that is not develop, release/x.x.x, or electron/x.x.x related
when:
  and:
    - not:
        matches:
            pattern: /^release\/\d+\.\d+\.\d+$/
            value: << pipeline.git.branch >>
    - not:
        matches:
            pattern: /^electron\/\d+\.\d+\.\d+$/
            value: << pipeline.git.branch >>
    - not:
        equal: [ 'develop', << pipeline.git.branch >> ]
    - not:
        equal: [ 'update-v8-snapshot-cache-on-develop', << pipeline.git.branch >> ]
    - not:
        equal: [ true, << pipeline.parameters.force-persist-artifacts >> ]
    # temporary branches that can be removed after merging
    - not:
        equal: [ 'mschile/electron_41', << pipeline.git.branch >> ]

jobs:
  # Internal PRs — install and build run immediately
  - node_modules_install:
      build-better-sqlite3: true
      filters:
        branches:
          ignore: /^pull\/[0-9]+/
  - build:
      name: internal-pr-build
      context: test-runner:env-canary
      requires:
        - node_modules_install
      filters:
        branches:
          ignore: /^pull\/[0-9]+/

  # External (contributor) PRs — everything gates behind manual approval
  - approve-contributor-pr:
      type: approval
      filters:
        branches:
          only: /^pull\/[0-9]+/
  - node_modules_install:
      name: contributor-node-modules-install
      build-better-sqlite3: true
      requires:
        - approve-contributor-pr
      filters:
        branches:
          only: /^pull\/[0-9]+/
  - build:
      name: external-pr-build
      requires:
        - contributor-node-modules-install
      filters:
        branches:
          only: /^pull\/[0-9]+/
  - ready-to-test:
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - check-lockfile:
      requires:
        - internal-pr-build
        - external-pr-build
  - check-ts:
      requires:
        - internal-pr-build
        - external-pr-build
  - health-check:
      requires:
        - internal-pr-build
        - external-pr-build
  - lint:
      name: linux-lint
      requires:
        - internal-pr-build
        - external-pr-build
  - lint-types:
      requires:
        - internal-pr-build
        - external-pr-build
  # The following jobs are only run for contributor PRs once they are approved.
  # Each job checks its pipeline parameter at startup and halts early if the
  # changed files don't require it to run.
  - cli-visual-tests:
      context: test-runner:percy
      requires:
        - ready-to-test
  - unit-tests:
      requires:
        - ready-to-test
  - server-unit-tests:
      requires:
        - ready-to-test
  - server-integration-tests:
      requires:
        - ready-to-test
  - server-performance-tests:
      requires:
        - ready-to-test
  - system-tests-node-modules-install:
      context: test-runner:performance-tracking
      requires:
        - ready-to-test
  - system-tests-chrome:
      context: test-runner:performance-tracking
      requires:
        - system-tests-node-modules-install
  - system-tests-electron:
      context: test-runner:performance-tracking
      requires:
        - system-tests-node-modules-install
  - system-tests-firefox:
      context: test-runner:performance-tracking
      requires:
        - system-tests-node-modules-install
  - system-tests-webkit:
      context: test-runner:performance-tracking
      requires:
        - system-tests-node-modules-install
  - system-tests-non-root:
      context: test-runner:performance-tracking
      executor: non-root-docker-user
      requires:
        - system-tests-node-modules-install
  - driver-integration-tests-chrome:
      context: test-runner:cypress-record-key
      requires:
        - ready-to-test
  - h2-dual-stack-tests:
      context: test-runner:performance-tracking
      requires:
        - ready-to-test
  - driver-integration-tests-chrome-inject-document-domain:
      context: test-runner:cypress-record-key
      requires:
        - ready-to-test
  - driver-integration-tests-chrome-beta:
      context: test-runner:cypress-record-key
      requires:
        - ready-to-test
  - driver-integration-tests-chrome-beta-inject-document-domain:
      context: test-runner:cypress-record-key
      requires:
        - ready-to-test
  - driver-integration-tests-firefox:
      context: test-runner:cypress-record-key
      requires:
        - ready-to-test
  - driver-integration-tests-electron:
      context: test-runner:cypress-record-key
      requires:
        - ready-to-test
  - driver-integration-tests-webkit:
      context: test-runner:cypress-record-key
      requires:
        - ready-to-test
  - driver-integration-memory-tests:
      requires:
        - ready-to-test
  - run-frontend-shared-component-tests-chrome:
      context:
        [
          test-runner:cypress-record-key,
          test-runner:launchpad-tests,
          test-runner:percy
        ]
      percy: true
      requires:
        - ready-to-test
  - run-launchpad-integration-tests-chrome:
      context:
        [
          test-runner:cypress-record-key,
          test-runner:launchpad-tests,
          test-runner:percy
        ]
      percy: true
      requires:
        - ready-to-test
  - run-launchpad-component-tests-chrome:
      context:
        [
          test-runner:cypress-record-key,
          test-runner:launchpad-tests,
          test-runner:percy
        ]
      percy: true
      requires:
        - ready-to-test
  - run-app-integration-tests-chrome:
      context:
        [
          test-runner:cypress-record-key,
          test-runner:launchpad-tests,
          test-runner:percy
        ]
      percy: true
      requires:
        - ready-to-test
  - run-webpack-dev-server-integration-tests:
      context: [ test-runner:cypress-record-key, test-runner:percy ]
      requires:
        - system-tests-node-modules-install
  - run-vite-dev-server-integration-tests:
      context: [ test-runner:cypress-record-key, test-runner:percy ]
      requires:
        - system-tests-node-modules-install
  - run-app-component-tests-chrome:
      context:
        [
          test-runner:cypress-record-key,
          test-runner:launchpad-tests,
          test-runner:percy
        ]
      percy: true
      requires:
        - ready-to-test
  - run-reporter-component-tests-chrome:
      context: [ test-runner:cypress-record-key, test-runner:percy ]
      percy: true
      requires:
        - ready-to-test
  - reporter-integration-tests:
      context: [ test-runner:cypress-record-key, test-runner:percy ]
      requires:
        - ready-to-test
  - npm-webpack-dev-server:
      requires:
        - system-tests-node-modules-install
  - npm-vite-dev-server:
      requires:
        - ready-to-test
  - npm-vite-plugin-cypress-esm:
      requires:
        - ready-to-test
  - npm-webpack-preprocessor:
      requires:
        - ready-to-test
  - npm-webpack-batteries-included-preprocessor:
      requires:
        - ready-to-test
  - npm-vue:
      requires:
        - ready-to-test
  - npm-puppeteer-unit-tests:
      requires:
        - ready-to-test
  - npm-puppeteer-cypress-tests:
      requires:
        - ready-to-test
  - npm-react:
      requires:
        - ready-to-test
  - npm-angular:
      requires:
        - ready-to-test
  - npm-mount-utils:
      requires:
        - ready-to-test
  - npm-grep:
      requires:
        - ready-to-test
  - npm-eslint-plugin-dev:
      requires:
        - ready-to-test
  - npm-cypress-schematic:
      requires:
        - ready-to-test
  - v8-integration-tests:
      requires:
        - system-tests-node-modules-install

  - proxy-transport-unit-tests:
      requires:
        - ready-to-test

  # forceHttp1 (HTTP/1 MITM proxy) coverage on Chrome. The browser (CDP Fetch)
  # network path is the Chrome-family default, so the regular chromium jobs no
  # longer touch the MITM proxy — forceHttp1: true is the only way onto it.
  # Firefox, WebKit, and Electron jobs still run the full MITM path on every
  # PR, so dedicated chromium coverage is two always-on smoke jobs over the
  # network-heavy specs.
  - driver-integration-tests-chrome:
      name: driver-integration-tests-chrome-force-http1-smoke
      context: test-runner:cypress-record-key
      force-http1: true
      parallelism: 1
      record-group-suffix: '-smoke'
      # mirrors run_driver_suite() in scripts/validate-proxy-middleware-transport.sh,
      # plus the MITM injection/interception-heavy specs (net_stubbing, security,
      # redirects, service-worker)
      spec: cypress/e2e/e2e/encoding.cy.ts,cypress/e2e/e2e/csp_headers.cy.js,cypress/e2e/cypress/proxy-logging.cy.ts,cypress/e2e/issues/3890.cy.js,cypress/e2e/cy/snapshot.cy.js,cypress/e2e/cypress/downloads.cy.ts,cypress/e2e/commands/net_stubbing.cy.ts,cypress/e2e/e2e/security.cy.js,cypress/e2e/e2e/redirects.cy.js,cypress/e2e/e2e/service-worker.cy.js
      requires:
        - ready-to-test
  - system-tests-chrome:
      name: system-tests-chrome-force-http1-smoke
      context: test-runner:performance-tracking
      force-http1: true
      parallelism: 1
      # proxy-pipeline-focused subset: request/response middleware, https-proxy
      # CONNECT handling, interception, caching, downloads, service workers
      spec: test/proxying_spec.ts test/network_error_handling_spec.js test/interception_spec.js test/web_security_spec.js test/service_worker_spec.js test/cache_spec.js test/downloads_spec.ts test/visit_spec.js
      requires:
        - system-tests-node-modules-install

  # Full forceHttp1 suites, added on top of the always-on smoke jobs by
  # Trigger Pipeline -> run-force-http1-tests=true. The expression filter means
  # they are not queued at all on ordinary PRs, and they reuse this workflow's
  # build rather than living in their own, which would duplicate
  # node_modules_install and build.
  # Not in all-jobs-passed: an investigation run against a known-broken path
  # should not block the PR.
  - driver-integration-tests-chrome:
      name: driver-integration-tests-chrome-force-http1
      context: test-runner:cypress-record-key
      force-http1: true
      filters: pipeline.parameters.run-force-http1-tests == true
      requires:
        - ready-to-test
  - system-tests-chrome:
      name: system-tests-chrome-force-http1
      context: test-runner:performance-tracking
      force-http1: true
      filters: pipeline.parameters.run-force-http1-tests == true
      requires:
        - system-tests-node-modules-install
  - run-app-integration-tests-chrome:
      name: run-app-integration-tests-chrome-force-http1
      context:
        [
          test-runner:cypress-record-key,
          test-runner:launchpad-tests,
          test-runner:percy
        ]
      force-http1: true
      filters: pipeline.parameters.run-force-http1-tests == true
      requires:
        - ready-to-test
  - run-launchpad-integration-tests-chrome:
      name: run-launchpad-integration-tests-chrome-force-http1
      context:
        [
          test-runner:cypress-record-key,
          test-runner:launchpad-tests,
          test-runner:percy
        ]
      force-http1: true
      filters: pipeline.parameters.run-force-http1-tests == true
      requires:
        - ready-to-test

  - create-and-trigger-packaging-artifacts:
      context:
        - test-runner:upload
        - test-runner:build-binary
        - publish-binary
      requires:
        - node_modules_install
        - internal-pr-build
      filters:
        branches:
          ignore: /^pull\/[0-9]+/
  - wait-for-binary-publish:
      type: approval
      requires:
        - create-and-trigger-packaging-artifacts
  - get-published-artifacts:
      context:
        - publish-binary
        - test-runner:commit-status-checks
      requires:
        - wait-for-binary-publish
  - test-kitchensink:
      requires:
        - ready-to-test
  - test-npm-module-on-minimum-node-version:
      context: publish-binary
      requires:
        - get-published-artifacts
  - test-types-cypress-and-jest:
      context: publish-binary
      requires:
        - get-published-artifacts
  - test-full-typescript-project:
      context: publish-binary
      requires:
        - get-published-artifacts
  - test-binary-against-kitchensink:
      context: publish-binary
      requires:
        - get-published-artifacts
  - test-binary-as-specific-user:
      name: "test binary as a non-root user"
      executor: non-root-docker-user
      context: publish-binary
      requires:
        - get-published-artifacts
  - test-binary-as-specific-user:
      name: "test binary as a root user"
      context: publish-binary
      requires:
        - get-published-artifacts
  - binary-system-tests:
      context: publish-binary
      requires:
        - get-published-artifacts
        - system-tests-node-modules-install
  - yarn-pnp-preprocessor-system-test:
      context: publish-binary
      requires:
        - get-published-artifacts
        - system-tests-node-modules-install
  - svelte-webpack-system-test:
      context: publish-binary
      requires:
        - get-published-artifacts
        - system-tests-node-modules-install

  # Finalization jobs
  - percy-finalize:
      context: test-runner:percy
      required_env_var: PERCY_TOKEN
      requires:
        - cli-visual-tests
        - reporter-integration-tests
        - run-app-component-tests-chrome
        - run-app-integration-tests-chrome
        - run-frontend-shared-component-tests-chrome
        - run-launchpad-component-tests-chrome
        - run-launchpad-integration-tests-chrome
        - run-reporter-component-tests-chrome
        - run-webpack-dev-server-integration-tests
        - run-vite-dev-server-integration-tests
  # Cypress run must be completed to fetch Accessibility report
  - verify-accessibility-results:
      context: test-runner:cypress-record-key
      requires:
        - reporter-integration-tests
        - run-app-component-tests-chrome
        - run-app-integration-tests-chrome
        - run-frontend-shared-component-tests-chrome
        - run-launchpad-component-tests-chrome
        - run-launchpad-integration-tests-chrome
        - run-reporter-component-tests-chrome
        - run-webpack-dev-server-integration-tests
        - run-vite-dev-server-integration-tests
        - driver-integration-tests-firefox
        - driver-integration-tests-chrome
        - driver-integration-tests-chrome-inject-document-domain
        - driver-integration-tests-chrome-beta-inject-document-domain
        - driver-integration-tests-electron
        - driver-integration-tests-webkit
        - driver-integration-memory-tests

  # Fan-in aggregator — the only required GitHub status check for PRs.
  # Required jobs fan into this one. Jobs that halt early (pipeline parameter
  # false) still complete successfully.
  - all-jobs-passed:
      requires:
        # Always-run jobs
        - linux-lint
        - check-lockfile
        - check-ts
        - health-check
        - lint-types
        - test-kitchensink
        # Conditional jobs (halt early when not needed)
        - cli-visual-tests
        - unit-tests
        - server-unit-tests
        - server-integration-tests
        - server-performance-tests
        - system-tests-chrome
        - system-tests-electron
        - system-tests-firefox
        - system-tests-webkit
        - system-tests-non-root
        - h2-dual-stack-tests
        - proxy-transport-unit-tests
        - driver-integration-tests-chrome-force-http1-smoke
        - system-tests-chrome-force-http1-smoke
        - driver-integration-tests-chrome
        - driver-integration-tests-chrome-inject-document-domain
        - driver-integration-tests-chrome-beta
        - driver-integration-tests-chrome-beta-inject-document-domain
        - driver-integration-tests-firefox
        - driver-integration-tests-electron
        - driver-integration-tests-webkit
        - driver-integration-memory-tests
        - run-frontend-shared-component-tests-chrome
        - run-launchpad-integration-tests-chrome
        - run-launchpad-component-tests-chrome
        - run-app-integration-tests-chrome
        - run-app-component-tests-chrome
        - run-reporter-component-tests-chrome
        - reporter-integration-tests
        - run-webpack-dev-server-integration-tests
        - run-vite-dev-server-integration-tests
        - npm-webpack-dev-server
        - npm-vite-dev-server
        - npm-vite-plugin-cypress-esm
        - npm-webpack-preprocessor
        - npm-webpack-batteries-included-preprocessor
        - npm-vue
        - npm-puppeteer-unit-tests
        - npm-puppeteer-cypress-tests
        - npm-react
        - npm-angular
        - npm-mount-utils
        - npm-grep
        - npm-eslint-plugin-dev
        - npm-cypress-schematic
        - v8-integration-tests
