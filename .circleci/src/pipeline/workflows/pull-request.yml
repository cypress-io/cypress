# TEMPORARY MINIMAL WORKFLOW — stress-test only the jobs that exercise the
# @cypress/vite-dev-server fix for #25913. Original pull-request.yml was
# heavily trimmed for this branch; restore from git history before merging.
#
# The workflow runs for:
# External PR after approval (approved contributor PR that's not a main branch)
# Internal PR for any branch that does is not develop or release/ related
when:
  and:
    - not:
        matches:
            pattern: /^release\//
            value: << pipeline.git.branch >>
    - not:
        matches:
            pattern: /^develop/
            value: << pipeline.git.branch >>
    - not:
        equal: [ true, << pipeline.parameters.force-persist-artifacts >> ]

jobs:
  # ---- build chain (required by every test job below) ----------------------
  - node_modules_install:
      build-better-sqlite3: true
  - build:
      name: internal-pr-build
      context: test-runner:env-canary
      requires:
        - node_modules_install
      filters:
        branches:
          ignore: /^pull\/[0-9]+/
  - build:
      name: external-pr-build
      requires:
        - node_modules_install
      filters:
        branches:
          only: /^pull\/[0-9]+/
  - approve-contributor-pr:
      type: approval
      filters:
        branches:
          only: /^pull\/[0-9]+/

  # ---- system-tests dep install (required by system-tests-* below) ---------
  - system-tests-node-modules-install:
      context: test-runner:performance-tracking
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr

  # ---- stress: vite_dev_server_fresh_spec.ts × 20 --------------------------
