# The workflow runs for:
# External PR after approval (approved contributor PR that's not a main branch)
# Internal PR for any branch that is not develop, release/x.x.x, or electron/x.x.x related
when:
  and:
    - not:
        matches:
            pattern: /^release\/\d+\.\d+\.\d+$/
            value: << pipeline.git.branch >>
    - not:
        matches:
            pattern: /^electron\/\d+\.\d+\.\d+$/
            value: << pipeline.git.branch >>
    - not:
        equal: [ 'develop', << pipeline.git.branch >> ]
    - not:
        equal: [ 'update-v8-snapshot-cache-on-develop', << pipeline.git.branch >> ]
    - not:
        equal: [ true, << pipeline.parameters.force-persist-artifacts >> ]

jobs:
  # EXPERIMENT (branch bill/3708/h2-latency-15ms only) — every job unrelated to
  # the proxy performance benchmark is removed so one bisection run costs a
  # single container instead of ~60. Restore before merging anything:
  #   git checkout origin/develop -- .circleci/src/pipeline/workflows/pull-request.yml
  - node_modules_install:
      build-better-sqlite3: true
      filters:
        branches:
          ignore: /^pull\/[0-9]+/
  - build:
      name: internal-pr-build
      context: test-runner:env-canary
      requires:
        - node_modules_install
      filters:
        branches:
          ignore: /^pull\/[0-9]+/
  # trimmed to internal-pr-build only: the contributor-approval chain is
  # removed above, so requiring external-pr-build would not validate
  - ready-to-test:
      requires:
        - internal-pr-build
  - server-performance-tests:
      requires:
        - ready-to-test
  # kept so PR branch protection still has its single required status check
  - all-jobs-passed:
      requires:
        - server-performance-tests
