# The workflow runs for:
# External PR after approval (approved contributor PR that's not a main branch)
# Internal PR for any branch that does is not develop or release/ related
when:
  and:
    - not:
        matches:
            pattern: /^release\//
            value: << pipeline.git.branch >>
    - not:
        matches:
            pattern: /^develop/
            value: << pipeline.git.branch >>
    - not:
        equal: [ true, << pipeline.parameters.force-persist-artifacts >> ]

jobs:
  # Always run — these are cheap and catch broad issues regardless of what changed
  - node_modules_install:
      build-better-sqlite3: true
  - build:
      name: internal-pr-build
      context: test-runner:env-canary
      requires:
        - node_modules_install
      filters:
        branches:
          ignore: /^pull\/[0-9]+/
  - build:
      name: external-pr-build
      requires:
        - node_modules_install
      filters:
        branches:
          only: /^pull\/[0-9]+/
  - check-ts:
      requires:
        - internal-pr-build
        - external-pr-build
  - health-check:
      requires:
        - internal-pr-build
        - external-pr-build
  - lint:
      name: linux-lint
      requires:
        - internal-pr-build
        - external-pr-build
  - lint-types:
      requires:
        - internal-pr-build
        - external-pr-build
  - approve-contributor-pr:
      type: approval
      filters:
        branches:
          only: /^pull\/[0-9]+/

  # The following jobs are only run for contributor PRs once they are approved
  # unit, integration and e2e tests
  - cli-visual-tests:
      when: << pipeline.parameters.run-cli-tests >>
      context: test-runner:percy
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - unit-tests:
      when: << pipeline.parameters.run-unit-tests >>
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - verify-release-readiness:
      when: << pipeline.parameters.run-unit-tests >>
      context: [test-runner:npm-release, org-npm-credentials]
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - server-unit-tests:
      when: << pipeline.parameters.run-server-tests >>
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - server-integration-tests:
      when: << pipeline.parameters.run-server-tests >>
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - server-performance-tests:
      when: << pipeline.parameters.run-server-tests >>
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr

  # system-tests-node-modules-install is a prerequisite for system-tests-* AND
  # for some npm dev-server tests. Run it when any of those are needed.
  - system-tests-node-modules-install:
      when:
        or:
          - << pipeline.parameters.run-system-tests >>
          - << pipeline.parameters.run-npm-webpack-dev-server-tests >>
          - << pipeline.parameters.run-npm-vite-dev-server-tests >>
          - << pipeline.parameters.run-v8-tests >>
      context: test-runner:performance-tracking
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - system-tests-chrome:
      when: << pipeline.parameters.run-system-tests >>
      context: test-runner:performance-tracking
      requires:
        - system-tests-node-modules-install
  - system-tests-electron:
      when: << pipeline.parameters.run-system-tests >>
      context: test-runner:performance-tracking
      requires:
        - system-tests-node-modules-install
  - system-tests-firefox:
      when: << pipeline.parameters.run-system-tests >>
      context: test-runner:performance-tracking
      requires:
        - system-tests-node-modules-install
  - system-tests-webkit:
      when: << pipeline.parameters.run-system-tests >>
      context: test-runner:performance-tracking
      requires:
        - system-tests-node-modules-install
  - system-tests-non-root:
      when: << pipeline.parameters.run-system-tests >>
      context: test-runner:performance-tracking
      executor: non-root-docker-user
      requires:
        - system-tests-node-modules-install
  - driver-integration-tests-chrome:
      when: << pipeline.parameters.run-driver-tests >>
      context: test-runner:cypress-record-key
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - driver-integration-tests-chrome-inject-document-domain:
      when: << pipeline.parameters.run-driver-tests >>
      context: test-runner:cypress-record-key
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - driver-integration-tests-chrome-beta:
      when: << pipeline.parameters.run-driver-tests >>
      context: test-runner:cypress-record-key
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - driver-integration-tests-chrome-beta-inject-document-domain:
      when: << pipeline.parameters.run-driver-tests >>
      context: test-runner:cypress-record-key
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - driver-integration-tests-firefox:
      when: << pipeline.parameters.run-driver-tests >>
      context: test-runner:cypress-record-key
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - driver-integration-tests-electron:
      when: << pipeline.parameters.run-driver-tests >>
      context: test-runner:cypress-record-key
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - driver-integration-tests-webkit:
      when: << pipeline.parameters.run-driver-tests >>
      context: test-runner:cypress-record-key
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - driver-integration-memory-tests:
      when: << pipeline.parameters.run-driver-tests >>
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - run-frontend-shared-component-tests-chrome:
      when: << pipeline.parameters.run-frontend-shared-tests >>
      context:
        [
          test-runner:cypress-record-key,
          test-runner:launchpad-tests,
          test-runner:percy
        ]
      percy: true
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - run-launchpad-integration-tests-chrome:
      when: << pipeline.parameters.run-launchpad-tests >>
      context:
        [
          test-runner:cypress-record-key,
          test-runner:launchpad-tests,
          test-runner:percy
        ]
      percy: true
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - run-launchpad-component-tests-chrome:
      when: << pipeline.parameters.run-launchpad-tests >>
      context:
        [
          test-runner:cypress-record-key,
          test-runner:launchpad-tests,
          test-runner:percy
        ]
      percy: true
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - run-app-integration-tests-chrome:
      when: << pipeline.parameters.run-app-ui-tests >>
      context:
        [
          test-runner:cypress-record-key,
          test-runner:launchpad-tests,
          test-runner:percy
        ]
      percy: true
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - run-webpack-dev-server-integration-tests:
      when:
        and:
          - << pipeline.parameters.run-npm-webpack-dev-server-tests >>
          - << pipeline.parameters.run-system-tests >>
      context: [ test-runner:cypress-record-key, test-runner:percy ]
      requires:
        - system-tests-node-modules-install
  - run-vite-dev-server-integration-tests:
      when:
        and:
          - << pipeline.parameters.run-npm-vite-dev-server-tests >>
          - << pipeline.parameters.run-system-tests >>
      context: [ test-runner:cypress-record-key, test-runner:percy ]
      requires:
        - system-tests-node-modules-install
  - run-app-component-tests-chrome:
      when: << pipeline.parameters.run-app-ui-tests >>
      context:
        [
          test-runner:cypress-record-key,
          test-runner:launchpad-tests,
          test-runner:percy
        ]
      percy: true
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - run-reporter-component-tests-chrome:
      when: << pipeline.parameters.run-reporter-tests >>
      context: [ test-runner:cypress-record-key, test-runner:percy ]
      percy: true
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - reporter-integration-tests:
      when: << pipeline.parameters.run-reporter-tests >>
      context: [ test-runner:cypress-record-key, test-runner:percy ]
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - npm-webpack-dev-server:
      when: << pipeline.parameters.run-npm-webpack-dev-server-tests >>
      requires:
        - system-tests-node-modules-install
  - npm-vite-dev-server:
      when: << pipeline.parameters.run-npm-vite-dev-server-tests >>
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - npm-vite-plugin-cypress-esm:
      when: << pipeline.parameters.run-npm-vite-plugin-esm-tests >>
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - npm-webpack-preprocessor:
      when: << pipeline.parameters.run-npm-webpack-preprocessor-tests >>
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - npm-webpack-batteries-included-preprocessor:
      when: << pipeline.parameters.run-npm-webpack-batteries-tests >>
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - npm-vue:
      when: << pipeline.parameters.run-npm-vue-tests >>
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - npm-puppeteer-unit-tests:
      when: << pipeline.parameters.run-npm-puppeteer-tests >>
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - npm-puppeteer-cypress-tests:
      when: << pipeline.parameters.run-npm-puppeteer-tests >>
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - npm-react:
      when: << pipeline.parameters.run-npm-react-tests >>
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - npm-angular:
      when: << pipeline.parameters.run-npm-angular-tests >>
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - npm-angular-zoneless:
      when: << pipeline.parameters.run-npm-angular-tests >>
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - npm-mount-utils:
      when: << pipeline.parameters.run-npm-mount-utils-tests >>
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - npm-grep:
      when: << pipeline.parameters.run-npm-grep-tests >>
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - npm-eslint-plugin-dev:
      when: << pipeline.parameters.run-npm-eslint-plugin-tests >>
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - npm-cypress-schematic:
      when: << pipeline.parameters.run-npm-schematic-tests >>
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - v8-integration-tests:
      when: << pipeline.parameters.run-v8-tests >>
      requires:
        - system-tests-node-modules-install

  - create-and-trigger-packaging-artifacts:
      context:
        - test-runner:upload
        - test-runner:build-binary
        - publish-binary
      requires:
        - node_modules_install
        - internal-pr-build
      filters:
        branches:
          ignore: /^pull\/[0-9]+/
  - wait-for-binary-publish:
      type: approval
      requires:
        - create-and-trigger-packaging-artifacts
  - get-published-artifacts:
      context:
        - publish-binary
        - test-runner:commit-status-checks
      requires:
        - wait-for-binary-publish
  - test-kitchensink:
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - test-npm-module-on-minimum-node-version:
      context: publish-binary
      requires:
        - get-published-artifacts
  - test-types-cypress-and-jest:
      context: publish-binary
      requires:
        - get-published-artifacts
  - test-full-typescript-project:
      context: publish-binary
      requires:
        - get-published-artifacts
  - test-binary-against-kitchensink:
      context: publish-binary
      requires:
        - get-published-artifacts
  - test-binary-as-specific-user:
      name: "test binary as a non-root user"
      executor: non-root-docker-user
      context: publish-binary
      requires:
        - get-published-artifacts
  - test-binary-as-specific-user:
      name: "test binary as a root user"
      context: publish-binary
      requires:
        - get-published-artifacts
  - binary-system-tests:
      context: publish-binary
      requires:
        - get-published-artifacts
        - system-tests-node-modules-install
  - yarn-pnp-preprocessor-system-test:
      context: publish-binary
      requires:
        - get-published-artifacts
        - system-tests-node-modules-install
  - svelte-webpack-system-test:
      context: publish-binary
      requires:
        - get-published-artifacts
        - system-tests-node-modules-install

  # Finalization jobs — only run when at least one upstream Percy job ran.
  # The when: or: mirrors the upstream job conditions so CircleCI doesn't
  # block waiting for a job that was never scheduled.
  - percy-finalize:
      when:
        or:
          - << pipeline.parameters.run-cli-tests >>
          - << pipeline.parameters.run-reporter-tests >>
          - << pipeline.parameters.run-app-ui-tests >>
          - << pipeline.parameters.run-frontend-shared-tests >>
          - << pipeline.parameters.run-launchpad-tests >>
          - << pipeline.parameters.run-npm-webpack-dev-server-tests >>
          - << pipeline.parameters.run-npm-vite-dev-server-tests >>
      context: test-runner:percy
      required_env_var: PERCY_TOKEN
      requires:
        - cli-visual-tests
        - reporter-integration-tests
        - run-app-component-tests-chrome
        - run-app-integration-tests-chrome
        - run-frontend-shared-component-tests-chrome
        - run-launchpad-component-tests-chrome
        - run-launchpad-integration-tests-chrome
        - run-reporter-component-tests-chrome
        - run-webpack-dev-server-integration-tests
        - run-vite-dev-server-integration-tests
  # Fan-in aggregator — only required GitHub status check for PRs.
  # Requires every job in this workflow. When a job is excluded by its when:
  # condition, CircleCI treats it as absent and does not block this job.
  - all-jobs-passed:
      requires:
        # Always-run jobs
        - linux-lint
        - check-ts
        - health-check
        - lint-types
        - test-kitchensink
        # Conditional jobs — excluded ones are transparently skipped by CircleCI
        - cli-visual-tests
        - unit-tests
        - verify-release-readiness
        - server-unit-tests
        - server-integration-tests
        - server-performance-tests
        - system-tests-chrome
        - system-tests-electron
        - system-tests-firefox
        - system-tests-webkit
        - system-tests-non-root
        - driver-integration-tests-chrome
        - driver-integration-tests-chrome-inject-document-domain
        - driver-integration-tests-chrome-beta
        - driver-integration-tests-chrome-beta-inject-document-domain
        - driver-integration-tests-firefox
        - driver-integration-tests-electron
        - driver-integration-tests-webkit
        - driver-integration-memory-tests
        - run-frontend-shared-component-tests-chrome
        - run-launchpad-integration-tests-chrome
        - run-launchpad-component-tests-chrome
        - run-app-integration-tests-chrome
        - run-app-component-tests-chrome
        - run-reporter-component-tests-chrome
        - reporter-integration-tests
        - run-webpack-dev-server-integration-tests
        - run-vite-dev-server-integration-tests
        - npm-webpack-dev-server
        - npm-vite-dev-server
        - npm-vite-plugin-cypress-esm
        - npm-webpack-preprocessor
        - npm-webpack-batteries-included-preprocessor
        - npm-vue
        - npm-puppeteer-unit-tests
        - npm-puppeteer-cypress-tests
        - npm-react
        - npm-angular
        - npm-angular-zoneless
        - npm-mount-utils
        - npm-grep
        - npm-eslint-plugin-dev
        - npm-cypress-schematic
        - v8-integration-tests

  # Cypress run must be completed to fetch Accessibility report
  - verify-accessibility-results:
      when:
        or:
          - << pipeline.parameters.run-reporter-tests >>
          - << pipeline.parameters.run-app-ui-tests >>
          - << pipeline.parameters.run-frontend-shared-tests >>
          - << pipeline.parameters.run-launchpad-tests >>
          - << pipeline.parameters.run-npm-webpack-dev-server-tests >>
          - << pipeline.parameters.run-npm-vite-dev-server-tests >>
          - << pipeline.parameters.run-driver-tests >>
      context: test-runner:cypress-record-key
      requires:
        - reporter-integration-tests
        - run-app-component-tests-chrome
        - run-app-integration-tests-chrome
        - run-frontend-shared-component-tests-chrome
        - run-launchpad-component-tests-chrome
        - run-launchpad-integration-tests-chrome
        - run-reporter-component-tests-chrome
        - run-webpack-dev-server-integration-tests
        - run-vite-dev-server-integration-tests
        - driver-integration-tests-firefox
        - driver-integration-tests-chrome
        - driver-integration-tests-chrome-inject-document-domain
        - driver-integration-tests-chrome-beta-inject-document-domain
        - driver-integration-tests-electron
        - driver-integration-tests-webkit
        - driver-integration-memory-tests
