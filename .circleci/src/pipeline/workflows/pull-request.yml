# The workflow runs for:
# External PR after approval (approved contributor PR that's not a main branch)
# Internal PR for any branch that is not develop, release/x.x.x, vN, or electron/x.x.x related
when:
  and:
    - not:
        matches:
            pattern: /^release\/\d+\.\d+\.\d+$/
            value: << pipeline.git.branch >>
    - not:
        matches:
            pattern: /^v\d+$/
            value: << pipeline.git.branch >>
    - not:
        matches:
            pattern: /^electron\/\d+\.\d+\.\d+$/
            value: << pipeline.git.branch >>
    - not:
        equal: [ 'develop', << pipeline.git.branch >> ]
    - not:
        equal: [ 'update-v8-snapshot-cache-on-develop', << pipeline.git.branch >> ]
    - not:
        equal: [ true, << pipeline.parameters.force-persist-artifacts >> ]

jobs:
  # Internal PRs — install and build run immediately
  - node_modules_install:
      build-better-sqlite3: true
      filters:
        branches:
          ignore: /^pull\/[0-9]+/
  - build:
      name: internal-pr-build
      context: test-runner:env-canary
      requires:
        - node_modules_install
      filters:
        branches:
          ignore: /^pull\/[0-9]+/

  # External (contributor) PRs — everything gates behind manual approval
  - approve-contributor-pr:
      type: approval
      filters:
        branches:
          only: /^pull\/[0-9]+/
  - node_modules_install:
      name: contributor-node-modules-install
      build-better-sqlite3: true
      requires:
        - approve-contributor-pr
      filters:
        branches:
          only: /^pull\/[0-9]+/
  - build:
      name: external-pr-build
      requires:
        - contributor-node-modules-install
      filters:
        branches:
          only: /^pull\/[0-9]+/
  - ready-to-test:
      requires:
        - internal-pr-build
        - external-pr-build
        - approve-contributor-pr
  - check-lockfile:
      requires:
        - internal-pr-build
        - external-pr-build
  - check-ts:
      requires:
        - internal-pr-build
        - external-pr-build
  - health-check:
      requires:
        - internal-pr-build
        - external-pr-build
  - lint:
      name: linux-lint
      requires:
        - internal-pr-build
        - external-pr-build
  - lint-types:
      requires:
        - internal-pr-build
        - external-pr-build
  # The following jobs are only run for contributor PRs once they are approved.
  # Each job checks its pipeline parameter at startup and halts early if the
  # changed files don't require it to run.
  - cli-visual-tests:
      context: test-runner:percy
      filters: &runCliTests pipeline.parameters.run-cli-tests == true
      requires:
        - ready-to-test
  - unit-tests:
      filters: &runUnitTests pipeline.parameters.run-unit-tests == true
      requires:
        - ready-to-test
  - server-unit-tests:
      filters: &runServerTests pipeline.parameters.run-server-tests == true
      requires:
        - ready-to-test
  - server-integration-tests:
      filters: *runServerTests
      requires:
        - ready-to-test
  - server-performance-tests:
      filters: *runServerTests
      requires:
        - ready-to-test
  - system-tests-node-modules-install:
      context: test-runner:performance-tracking
      filters: pipeline.parameters.run-npm-vite-dev-server-tests == true or pipeline.parameters.run-npm-webpack-dev-server-tests == true or pipeline.parameters.run-system-tests == true or pipeline.parameters.run-v8-tests == true
      requires:
        - ready-to-test
  - system-tests-chrome:
      context: test-runner:performance-tracking
      filters: &runSystemTests pipeline.parameters.run-system-tests == true
      requires:
        - system-tests-node-modules-install
  - system-tests-electron:
      context: test-runner:performance-tracking
      filters: *runSystemTests
      requires:
        - system-tests-node-modules-install
  - system-tests-firefox:
      context: test-runner:performance-tracking
      filters: *runSystemTests
      requires:
        - system-tests-node-modules-install
  - system-tests-webkit:
      context: test-runner:performance-tracking
      filters: *runSystemTests
      requires:
        - system-tests-node-modules-install
  - system-tests-non-root:
      context: test-runner:performance-tracking
      executor: non-root-docker-user
      filters: *runSystemTests
      requires:
        - system-tests-node-modules-install
  - driver-integration-tests-chrome:
      context: test-runner:cypress-record-key
      filters: &runDriverTests pipeline.parameters.run-driver-tests == true
      requires:
        - ready-to-test
  - h2-dual-stack-tests:
      context: test-runner:performance-tracking
      filters: *runSystemTests
      requires:
        - ready-to-test
  - driver-integration-tests-chrome-inject-document-domain:
      context: test-runner:cypress-record-key
      filters: *runDriverTests
      requires:
        - ready-to-test
  - driver-integration-tests-chrome-beta:
      context: test-runner:cypress-record-key
      filters: *runDriverTests
      requires:
        - ready-to-test
  - driver-integration-tests-chrome-beta-inject-document-domain:
      context: test-runner:cypress-record-key
      filters: *runDriverTests
      requires:
        - ready-to-test
  - driver-integration-tests-firefox:
      context: test-runner:cypress-record-key
      filters: *runDriverTests
      requires:
        - ready-to-test
  - driver-integration-tests-electron:
      context: test-runner:cypress-record-key
      filters: *runDriverTests
      requires:
        - ready-to-test
  - driver-integration-tests-webkit:
      context: test-runner:cypress-record-key
      filters: *runDriverTests
      requires:
        - ready-to-test
  - driver-integration-memory-tests:
      filters: *runDriverTests
      requires:
        - ready-to-test
  - run-frontend-shared-component-tests-chrome:
      context:
        [
          test-runner:cypress-record-key,
          test-runner:launchpad-tests,
          test-runner:percy
        ]
      percy: true
      filters: &runFrontendSharedTests pipeline.parameters.run-frontend-shared-tests == true
      requires:
        - ready-to-test
  - run-launchpad-integration-tests-chrome:
      context:
        [
          test-runner:cypress-record-key,
          test-runner:launchpad-tests,
          test-runner:percy
        ]
      percy: true
      filters: &runLaunchpadTests pipeline.parameters.run-launchpad-tests == true
      requires:
        - ready-to-test
  - run-launchpad-component-tests-chrome:
      context:
        [
          test-runner:cypress-record-key,
          test-runner:launchpad-tests,
          test-runner:percy
        ]
      percy: true
      filters: *runLaunchpadTests
      requires:
        - ready-to-test
  - run-app-integration-tests-chrome:
      context:
        [
          test-runner:cypress-record-key,
          test-runner:launchpad-tests,
          test-runner:percy
        ]
      percy: true
      filters: &runAppUiTests pipeline.parameters.run-app-ui-tests == true
      requires:
        - ready-to-test
  - run-webpack-dev-server-integration-tests:
      context: [ test-runner:cypress-record-key, test-runner:percy ]
      filters: &runNpmWebpackDevServerTests pipeline.parameters.run-npm-webpack-dev-server-tests == true
      requires:
        - system-tests-node-modules-install
  - run-vite-dev-server-integration-tests:
      context: [ test-runner:cypress-record-key, test-runner:percy ]
      filters: &runNpmViteDevServerTests pipeline.parameters.run-npm-vite-dev-server-tests == true
      requires:
        - system-tests-node-modules-install
  - run-app-component-tests-chrome:
      context:
        [
          test-runner:cypress-record-key,
          test-runner:launchpad-tests,
          test-runner:percy
        ]
      percy: true
      filters: *runAppUiTests
      requires:
        - ready-to-test
  - run-reporter-component-tests-chrome:
      context: [ test-runner:cypress-record-key, test-runner:percy ]
      percy: true
      filters: &runReporterTests pipeline.parameters.run-reporter-tests == true
      requires:
        - ready-to-test
  - reporter-integration-tests:
      context: [ test-runner:cypress-record-key, test-runner:percy ]
      filters: *runReporterTests
      requires:
        - ready-to-test
  - npm-webpack-dev-server:
      filters: *runNpmWebpackDevServerTests
      requires:
        - system-tests-node-modules-install
  - npm-vite-dev-server:
      filters: *runNpmViteDevServerTests
      requires:
        - ready-to-test
  - npm-vite-plugin-cypress-esm:
      filters: &runNpmVitePluginEsmTests pipeline.parameters.run-npm-vite-plugin-esm-tests == true
      requires:
        - ready-to-test
  - npm-webpack-preprocessor:
      filters: &runNpmWebpackPreprocessorTests pipeline.parameters.run-npm-webpack-preprocessor-tests == true
      requires:
        - ready-to-test
  - npm-webpack-batteries-included-preprocessor:
      filters: &runNpmWebpackBatteriesTests pipeline.parameters.run-npm-webpack-batteries-tests == true
      requires:
        - ready-to-test
  - npm-vue:
      filters: &runNpmVueTests pipeline.parameters.run-npm-vue-tests == true
      requires:
        - ready-to-test
  - npm-puppeteer-unit-tests:
      filters: &runNpmPuppeteerTests pipeline.parameters.run-npm-puppeteer-tests == true
      requires:
        - ready-to-test
  - npm-puppeteer-cypress-tests:
      filters: *runNpmPuppeteerTests
      requires:
        - ready-to-test
  - npm-react:
      filters: &runNpmReactTests pipeline.parameters.run-npm-react-tests == true
      requires:
        - ready-to-test
  - npm-angular:
      filters: &runNpmAngularTests pipeline.parameters.run-npm-angular-tests == true
      requires:
        - ready-to-test
  - npm-angular-zoneless:
      filters: *runNpmAngularTests
      requires:
        - ready-to-test
  - npm-mount-utils:
      filters: &runNpmMountUtilsTests pipeline.parameters.run-npm-mount-utils-tests == true
      requires:
        - ready-to-test
  - npm-grep:
      filters: &runNpmGrepTests pipeline.parameters.run-npm-grep-tests == true
      requires:
        - ready-to-test
  - npm-eslint-plugin-dev:
      filters: &runNpmEslintPluginTests pipeline.parameters.run-npm-eslint-plugin-tests == true
      requires:
        - ready-to-test
  - npm-cypress-schematic:
      filters: &runNpmSchematicTests pipeline.parameters.run-npm-schematic-tests == true
      requires:
        - ready-to-test
  - v8-integration-tests:
      filters: &runV8Tests pipeline.parameters.run-v8-tests == true
      requires:
        - system-tests-node-modules-install

  # Proxy-disabled CDP remediations (*-cdp-remediated): known-green subsets that
  # always run when their path filters match (require-opt-in: false). Append
  # specs here as fixes land. When a remediations list covers the full suite,
  # flip the matching *-cdp job to always-on and delete *-cdp-remediated.
  # Electron has no *-cdp job: it is deprecated as a test browser and stays on
  # the HTTP/1 proxy.
  # #34464 cookie coverage that stays green under DISABLE_PROXY is jar sync +
  # OAuth only (system-tests-cookies-cdp). The full e2e cookies 80/443 matrix
  # is deferred to #34508 (under #34353).
  - system-tests-chrome:
      name: system-tests-chrome-cdp-remediated
      filters: *runSystemTests
      context: test-runner:performance-tracking
      disable-proxy: true
      require-opt-in: false
      parallelism: 1
      # #34351 upstream HTTP_PROXY/NO_PROXY; #34271 strategy:file downloads; #34467 continue unmodified CDP Fetch responses;
      # #34514 strategy:file origin serving + #34379 intercept-matched visit pre-flights (visits, web security, service workers).
      # #34563 graphql-ws upgrades target the Cypress server origin (request_spec); non_proxied_spec asserts proxy
      # semantics that do not exist here and skips itself.
      # #34470 skip the eager CDP Fetch body read for stream-shaped responses (SSE).
      # proxy_correlation_spec omitted: Chrome CI flakes on CorrelateBrowserPreRequest timeouts under
      # concurrent large-body CDP Fetch (47 unmatched localhost requests).
      spec: test/network_error_handling_spec.js test/downloads_spec.ts test/proxying_spec.ts test/images_spec.js test/form_submissions_spec.js test/page_loading_spec.js test/interception_spec.js test/cache_spec.js test/base_url_spec.js test/visit_spec.js test/web_security_spec.js test/service_worker_spec.js test/service_worker_protocol_spec.js test/request_spec.ts test/non_proxied_spec.ts test/server_sent_events_spec.js
      requires:
        - system-tests-node-modules-install
  - system-tests-cookies-cdp:
      filters: *runSystemTests
      context: test-runner:performance-tracking
      requires:
        - system-tests-node-modules-install
  - run-launchpad-integration-tests-chrome:
      name: run-launchpad-integration-tests-chrome-cdp-remediated
      filters: *runLaunchpadTests
      context:
        [
          test-runner:cypress-record-key,
          test-runner:launchpad-tests,
          test-runner:percy
        ]
      disable-proxy: true
      require-opt-in: false
      parallelism: 1
      record-group-suffix: '-remediated'
      # #34353 Invalid InterceptionId body-stream crash
      spec: cypress/e2e/choose-a-browser.cy.ts,cypress/e2e/open-mode.cy.ts
      requires:
        - ready-to-test
  - run-app-integration-tests-chrome:
      name: run-app-integration-tests-chrome-cdp-remediated
      filters: *runAppUiTests
      context:
        [
          test-runner:cypress-record-key,
          test-runner:launchpad-tests,
          test-runner:percy
        ]
      disable-proxy: true
      require-opt-in: false
      parallelism: 1
      record-group-suffix: '-remediated'
      # #34561 cypress-in-cypress specs: exercise the spec-transition teardown that
      # wedged on a zombie (disconnected-but-not-terminated) CDP connection when the
      # proxy is disabled.
      # #34603 debug + banner: window:before:load flag delivery and cy.intercept
      # visibility of inner-app graphql through the cy-in-cy internal-route release;
      # the uncaught-errors specs pin the release's injection boundary (the parent
      # must never partial-inject inner-owned frames).
      spec: cypress/e2e/cypress-in-cypress.cy.ts,cypress/e2e/cypress-in-cypress-e2e.cy.ts,cypress/e2e/cypress-in-cypress-run-mode.cy.ts,cypress/e2e/cypress-in-cypress-component.cy.ts,cypress/e2e/debug.cy.ts,cypress/e2e/cloud_message_banner.cy.ts,cypress/e2e/runner/reporter-ct-webpack.uncaught-errors.cy.ts,cypress/e2e/runner/reporter-ct-vite.uncaught-errors.cy.ts
      requires:
        - ready-to-test
  - driver-integration-tests-chrome:
      name: driver-integration-tests-chrome-cdp-remediated
      filters: *runDriverTests
      context: test-runner:cypress-record-key
      disable-proxy: true
      require-opt-in: false
      parallelism: 1
      record-group-suffix: '-remediated'
      # #34467 continue unmodified CDP Fetch responses; #34465 extra-target shared
      # middleware; #34512 extra-target Network.enable hang (downloads_basic_auth);
      # #34557 encoding drifts pinned per-pipeline (#34554, #34384, #34386);
      # #34555 service worker session interception; #34562 synthetic request query +
      # httpVersion drift; #34559 cloud-bundle loopback routes.
      # #34616 net_stubbing: the cy.intercept contract on this transport, including
      # the drifts pinned by #34611 — the three contract violations it now guards
      # went unnoticed because this spec had never run in a gating job.
      spec: cypress/e2e/e2e/security.cy.js,cypress/e2e/e2e/redirects.cy.js,cypress/e2e/cy/snapshot.cy.js,cypress/e2e/issues/3890.cy.js,cypress/e2e/cypress/downloads.cy.ts,cypress/e2e/cypress/downloads_basic_auth.cy.ts,cypress/e2e/e2e/encoding.cy.ts,cypress/e2e/e2e/service-worker.cy.js,cypress/e2e/cypress/proxy-logging.cy.ts,cypress/e2e/commands/prompt/prompt.cy.ts,cypress/e2e/commands/net_stubbing.cy.ts
      requires:
        - ready-to-test
  - unit-tests-proxy-disabled:
      filters: *runUnitTests
      requires:
        - ready-to-test

  # Full proxy-disabled (CDP Fetch) coverage (*-cdp) — off by default.
  # Enable with Trigger Pipeline → run-proxy-disabled-tests=true.
  # Omitted from all-jobs-passed so failures stay non-blocking when enabled.
  # Promote known-green specs into *-cdp-remediated above rather than flipping
  # these full suites on until remediations cover the entire suite.
  - driver-integration-tests-chrome:
      name: driver-integration-tests-chrome-cdp
      filters: pipeline.parameters.run-driver-tests == true and pipeline.parameters.run-proxy-disabled-tests == true
      context: test-runner:cypress-record-key
      disable-proxy: true
      requires:
        - ready-to-test
  - driver-integration-tests-chrome-inject-document-domain:
      name: driver-integration-tests-chrome-inject-document-domain-cdp
      filters: pipeline.parameters.run-driver-tests == true and pipeline.parameters.run-proxy-disabled-tests == true
      context: test-runner:cypress-record-key
      disable-proxy: true
      requires:
        - ready-to-test
  - system-tests-chrome:
      name: system-tests-chrome-cdp
      filters: pipeline.parameters.run-system-tests == true and pipeline.parameters.run-proxy-disabled-tests == true
      context: test-runner:performance-tracking
      disable-proxy: true
      requires:
        - system-tests-node-modules-install
  - run-app-integration-tests-chrome:
      name: run-app-integration-tests-chrome-cdp
      filters: pipeline.parameters.run-app-ui-tests == true and pipeline.parameters.run-proxy-disabled-tests == true
      context:
        [
          test-runner:cypress-record-key,
          test-runner:launchpad-tests,
          test-runner:percy
        ]
      disable-proxy: true
      requires:
        - ready-to-test
  - run-launchpad-integration-tests-chrome:
      name: run-launchpad-integration-tests-chrome-cdp
      filters: pipeline.parameters.run-launchpad-tests == true and pipeline.parameters.run-proxy-disabled-tests == true
      context:
        [
          test-runner:cypress-record-key,
          test-runner:launchpad-tests,
          test-runner:percy
        ]
      disable-proxy: true
      requires:
        - ready-to-test

  - test-kitchensink:
      requires:
        - ready-to-test

  # Finalization jobs
  - percy-finalize:
      context: test-runner:percy
      required_env_var: PERCY_TOKEN
      filters: pipeline.parameters.percy-enabled == true and (pipeline.parameters.run-app-ui-tests == true or pipeline.parameters.run-cli-tests == true or pipeline.parameters.run-frontend-shared-tests == true or pipeline.parameters.run-launchpad-tests == true or pipeline.parameters.run-npm-vite-dev-server-tests == true or pipeline.parameters.run-npm-webpack-dev-server-tests == true or pipeline.parameters.run-reporter-tests == true)
      requires:
        - cli-visual-tests
        - reporter-integration-tests
        - run-app-component-tests-chrome
        - run-app-integration-tests-chrome
        - run-frontend-shared-component-tests-chrome
        - run-launchpad-component-tests-chrome
        - run-launchpad-integration-tests-chrome
        - run-reporter-component-tests-chrome
        - run-webpack-dev-server-integration-tests
        - run-vite-dev-server-integration-tests

  # Fan-in aggregator — the only required GitHub status check for PRs.
  # Required jobs fan into this one. Jobs that halt early (pipeline parameter
  # false) still complete successfully. Full proxy-disabled *-cdp jobs above are
  # opt-in (run-proxy-disabled-tests) and intentionally omitted from this gate;
  # *-cdp-remediated known-green subsets are included.
  - all-jobs-passed:
      requires:
        # Always-run jobs
        - linux-lint
        - check-lockfile
        - check-ts
        - health-check
        - lint-types
        - test-kitchensink
        # Conditional jobs (halt early when not needed)
        - cli-visual-tests
        - unit-tests
        - server-unit-tests
        - server-integration-tests
        - server-performance-tests
        - system-tests-chrome
        - system-tests-electron
        - system-tests-firefox
        - system-tests-webkit
        - system-tests-non-root
        - h2-dual-stack-tests
        - system-tests-chrome-cdp-remediated
        - system-tests-cookies-cdp
        - unit-tests-proxy-disabled
        - run-launchpad-integration-tests-chrome-cdp-remediated
        - run-app-integration-tests-chrome-cdp-remediated
        - driver-integration-tests-chrome-cdp-remediated
        - driver-integration-tests-chrome
        - driver-integration-tests-chrome-inject-document-domain
        - driver-integration-tests-chrome-beta
        - driver-integration-tests-chrome-beta-inject-document-domain
        - driver-integration-tests-firefox
        - driver-integration-tests-electron
        - driver-integration-tests-webkit
        - driver-integration-memory-tests
        - run-frontend-shared-component-tests-chrome
        - run-launchpad-integration-tests-chrome
        - run-launchpad-component-tests-chrome
        - run-app-integration-tests-chrome
        - run-app-component-tests-chrome
        - run-reporter-component-tests-chrome
        - reporter-integration-tests
        - run-webpack-dev-server-integration-tests
        - run-vite-dev-server-integration-tests
        - npm-webpack-dev-server
        - npm-vite-dev-server
        - npm-vite-plugin-cypress-esm
        - npm-webpack-preprocessor
        - npm-webpack-batteries-included-preprocessor
        - npm-vue
        - npm-puppeteer-unit-tests
        - npm-puppeteer-cypress-tests
        - npm-react
        - npm-angular
        - npm-angular-zoneless
        - npm-mount-utils
        - npm-grep
        - npm-eslint-plugin-dev
        - npm-cypress-schematic
        - v8-integration-tests
