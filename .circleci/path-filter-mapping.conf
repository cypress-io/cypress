# Path → pipeline-parameter mapping for circleci/path-filtering@3.
#
# Format:  <python-regex>  <pipeline-parameter>  <value>
#
# How it works
#   * Regexes are automatically anchored with ^ and $.
#   * For each changed file, every rule whose regex matches sets its
#     <pipeline-parameter> to <value>.
#   * If multiple rules target the same parameter, the LAST matching rule wins.
#   * Parameters not set here keep the default declared in
#     .circleci/src/pipeline/@pipeline.yml (all default to `false`).
#   * Docs-only PRs (paths that match nothing here) therefore produce an
#     all-false parameter set → no conditional jobs run.
#
# Known gap
#   * A changed path that matches nothing here is silently treated as
#     "docs-only". When adding a new top-level directory or package, also add
#     a rule here. The aggregator `all-jobs-passed` still runs, so a missing
#     rule manifests as "CI was suspiciously fast" rather than a broken check.

# ---------- Global triggers ----------
# Changes that can affect any package force every conditional job to run.
\.circleci/.*                                   run-all-jobs                          true
yarn\.lock                                      run-all-jobs                          true
package\.json                                   run-all-jobs                          true
scripts/.*                                      run-all-jobs                          true
tooling/.*                                      run-all-jobs                          true
patches/.*                                      run-all-jobs                          true
\.node-version                                  run-all-jobs                          true

# Shared packages with broad downstream impact.
packages/types/.*                               run-all-jobs                          true
packages/config/.*                              run-all-jobs                          true
packages/errors/.*                              run-all-jobs                          true
packages/socket/.*                              run-all-jobs                          true
packages/network/.*                             run-all-jobs                          true
packages/network-tools/.*                       run-all-jobs                          true
packages/ts/.*                                  run-all-jobs                          true
packages/telemetry/.*                           run-all-jobs                          true
packages/eslint-config/.*                       run-all-jobs                          true

# ---------- Package → test-suite mapping ----------
# driver
packages/driver/.*                              run-driver-tests                      true
packages/driver/.*                              run-system-tests                      true

# server-side
packages/server/.*                              run-server-tests                      true
packages/server/.*                              run-system-tests                      true
packages/proxy/.*                               run-server-tests                      true
packages/proxy/.*                               run-system-tests                      true
packages/net-stubbing/.*                        run-server-tests                      true
packages/net-stubbing/.*                        run-driver-tests                      true
packages/net-stubbing/.*                        run-system-tests                      true
packages/rewriter/.*                            run-server-tests                      true
packages/rewriter/.*                            run-system-tests                      true
packages/https-proxy/.*                         run-server-tests                      true
packages/https-proxy/.*                         run-system-tests                      true

# frontend
packages/app/.*                                 run-app-ui-tests                      true
packages/app/.*                                 run-system-tests                      true
packages/launchpad/.*                           run-launchpad-tests                   true
packages/launchpad/.*                           run-system-tests                      true
packages/reporter/.*                            run-reporter-tests                    true
packages/reporter/.*                            run-app-ui-tests                      true
packages/frontend-shared/.*                     run-frontend-shared-tests             true
packages/frontend-shared/.*                     run-app-ui-tests                      true
packages/frontend-shared/.*                     run-launchpad-tests                   true
packages/frontend-shared/.*                     run-reporter-tests                    true

# data + runner glue
packages/data-context/.*                        run-app-ui-tests                      true
packages/data-context/.*                        run-launchpad-tests                   true
packages/data-context/.*                        run-server-tests                      true
packages/data-context/.*                        run-system-tests                      true
packages/runner/.*                              run-driver-tests                      true
packages/runner/.*                              run-app-ui-tests                      true
packages/web-config/.*                          run-driver-tests                      true
packages/web-config/.*                          run-app-ui-tests                      true

# electron / launcher / extension
packages/electron/.*                            run-driver-tests                      true
packages/electron/.*                            run-system-tests                      true
packages/extension/.*                           run-driver-tests                      true
packages/extension/.*                           run-system-tests                      true
packages/launcher/.*                            run-system-tests                      true
packages/scaffold-config/.*                     run-launchpad-tests                   true
packages/scaffold-config/.*                     run-system-tests                      true
packages/resolve-dist/.*                        run-app-ui-tests                      true
packages/resolve-dist/.*                        run-launchpad-tests                   true

# v8 snapshot
packages/v8-snapshot-require/.*                 run-v8-tests                          true
packages/packherd-require/.*                    run-v8-tests                          true

# cli + system-tests
cli/.*                                          run-cli-tests                         true
system-tests/.*                                 run-system-tests                      true

# ---------- Published npm/ packages ----------
npm/webpack-dev-server/.*                       run-npm-webpack-dev-server-tests      true
npm/vite-dev-server/.*                          run-npm-vite-dev-server-tests         true
npm/webpack-preprocessor/.*                     run-npm-webpack-preprocessor-tests    true
npm/webpack-batteries-included-preprocessor/.*  run-npm-webpack-batteries-tests       true
npm/vue/.*                                      run-npm-vue-tests                     true
npm/react/.*                                    run-npm-react-tests                   true
npm/angular/.*                                  run-npm-angular-tests                 true
npm/angular-zoneless/.*                         run-npm-angular-tests                 true
npm/puppeteer/.*                                run-npm-puppeteer-tests               true
npm/vite-plugin-cypress-esm/.*                  run-npm-vite-plugin-esm-tests         true
npm/mount-utils/.*                              run-npm-mount-utils-tests             true
npm/grep/.*                                     run-npm-grep-tests                    true
npm/eslint-plugin-dev/.*                        run-npm-eslint-plugin-tests           true
npm/cypress-schematic/.*                        run-npm-schematic-tests               true
