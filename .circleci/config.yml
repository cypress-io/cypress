orbs:
    continuation: circleci/continuation@1.1.0
    circleci-cli: circleci/circleci-cli@0.1.9
setup: true
version: 2.1

parameters:
  force-pack:
    type: boolean
    default: false

workflows:
    setup-workflow:
        jobs:
            - pack-workflows
            - launch-primary-workflow:
                requires:
                  - pack-workflows

commands:
  halt-early:
    steps:
      - run:
          name: Halt if CI should not run
          command: |
            # run CI when manually triggers via CircleCi Dashboard
            if [ <<pipeline.trigger_source>> == 'api' ]; then
              echo "Always run CI when manually triggered from the UI."
              exit 0
            fi

            if [[ "$CIRCLE_BRANCH" == "develop" || "$CIRCLE_BRANCH" == "release/"* ]]; then
              echo "Always run CI for develop and for release candidate branches."
              exit 0
            fi

            LAST_COMMIT_MESSAGE=$(curl --silent "https://api.github.com/repos/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/commits/${CIRCLE_BRANCH}" | jq '.commit.message')

            if [[ "$LAST_COMMIT_MESSAGE" =~ "run ci" ]]; then
              echo "Always run CI when the commit message includes 'run ci'."
              exit 0
            fi

            cancel_build () {
              echo "Canceling the CI build..."
              circleci-agent step halt
            }

            TRIGGER_INSTRUCTIONS="to trigger CI , include 'run ci' in the commit message or click the 'Trigger Pipeline' button in the CircleCI UI."

            if [ ! -z "${CIRCLE_PULL_REQUEST##*/}" ]; then
              DRAFT=$(curl --silent "https://api.github.com/repos/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/pulls/${CIRCLE_PULL_REQUEST##*/}" | jq '.draft')

              if [[ "${DRAFT}" == true ]]; then
                echo "Skipping CI; PR is in draft - $TRIGGER_INSTRUCTIONS"
                cancel_build
              fi

              echo "Always run CI for PR that is ready for review."
              exit 0
            fi

            echo "Skipping CI; branch in progress - $TRIGGER_INSTRUCTIONS"
            cancel_build
  persist-to-workspace-and-exit-early:
    parameters:
      cleanup:
        type: boolean
        default: false
    steps:
      - run:
          name: Check cache status and exit early if needed
          command: |
            if [[ -d ".circleci/packed" ]] && [[ "$(ls -A .circleci/packed 2>/dev/null)" ]] && [[ << pipeline.parameters.force-pack >> == false ]]; then
              echo "📦 Cache hit - packed configurations exist and force-pack is false"
              echo "✅ Persisting packed configurations to workspace and halting job"
              echo "CACHE_HIT=true" >> $BASH_ENV
            else
              echo "📦 Cache miss or force-pack is true - continuing with packaging"
              echo "CACHE_HIT=false" >> $BASH_ENV
              mkdir -p .circleci/packed # persist empty dir to workspace
            fi
      - persist_to_workspace:
          root: .
          paths:
            - .circleci/packed
      - run:
          name: End job if cache hit
          command: |
            
            if [[ "$CACHE_HIT" == "true" ]] && [[ "$(ls -A .circleci/packed 2>/dev/null)" ]]; then
              echo "✅ Cache hit - packed configurations exist and force-pack is false"
              exit 0
            else
              echo "📦 Cache miss or force-pack is true - continuing with packaging"
              if [[ << parameters.cleanup >> == true ]]; then
                rm -rf .circleci # remove empty directories
              fi
            fi

  pack-workflows:
    steps:
      - run:
          name: Pack workflows
          command: |
            ./scripts/pack-ci.sh --all
  validate-workflows:
    steps:
      - run:
          name: Validate workflows
          command: |
            ./scripts/pack-ci.sh --validate --pack=false
jobs:
  launch-primary-workflow:
      docker:
          - image: cimg/base:stable
      resource_class: small
      steps:
          - halt-early
          - attach_workspace:
              at: .
          - run:
              name: Check for primary workflow definition
              command: |
                if [ ! -f .circleci/packed/workflows.yml ]; then
                    echo "❌ Primary workflow definition not found!"
                    exit 1
                fi
          - continuation/continue:
              configuration_path: .circleci/packed/workflows.yml


  pack-workflows:
    docker:
        - image: cimg/base:stable
    resource_class: small
    steps:
        - halt-early
        - restore_cache:
            keys:
              - circleci-packed-pipelines-{{ .Revision }} # first check the rev, if it's there we don't need to checkout code to continue.
            paths:
                - .circleci/packed
        - persist-to-workspace-and-exit-early:
            cleanup: true
        - checkout
        - run:
            name: Generate config checksum for cache lookup
            command: |
              # Generate checksum of all .yml files in src directory
              find .circleci/src -name "*.yml" -type f | sort | xargs cat | md5sum | cut -d' ' -f1 > /tmp/config_checksum.txt
        - restore_cache:
            keys:
              - circleci-packed-pipelines-{{ checksum "/tmp/config_checksum.txt" }} # if this cache hits, we don't need to pack the workflows again
            paths:
                - .circleci/packed
        - persist-to-workspace-and-exit-early
        - circleci-cli/install
        - pack-workflows
        - save_cache:
            key: circleci-packed-pipelines-{{ .Revision }} # for caching same-rev reruns - no need to checkout code. early term optimization.
            paths:
                - .circleci/packed
        - save_cache:
            key: circleci-packed-pipelines-{{ checksum "/tmp/config_checksum.txt" }} # for caching runs w/ no circleci config changes, slower b/c of git checkout
            paths:
                - .circleci/packed
        - persist_to_workspace:
            root: .
            paths:
                - .circleci/packed



