orbs:
    continuation: circleci/continuation@1.1.0
setup: true
version: 2.1

parameters:
  force-pack:
    type: boolean
    default: false

workflows:
    setup-workflow:
        jobs:
            - pack-workflows
            - launch-primary-workflow:
                requires:
                  - pack-workflows

commands:
  halt-early:
    steps:
      - run:
          name: Halt if CI should not run
          command: |
            # run CI when manually triggers via CircleCi Dashboard
            if [ <<pipeline.trigger_source>> == 'api' ]; then
              echo "Always run CI when manually triggered from the UI."
              exit 0
            fi

            if [[ "$CIRCLE_BRANCH" == "develop" || "$CIRCLE_BRANCH" == "release/"* ]]; then
              echo "Always run CI for develop and for release candidate branches."
              exit 0
            fi

            LAST_COMMIT_MESSAGE=$(curl --silent "https://api.github.com/repos/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/commits/${CIRCLE_BRANCH}" | jq '.commit.message')

            if [[ "$LAST_COMMIT_MESSAGE" =~ "run ci" ]]; then
              echo "Always run CI when the commit message includes 'run ci'."
              exit 0
            fi

            cancel_build () {
              echo "Canceling the CI build..."
              circleci-agent step halt
            }

            TRIGGER_INSTRUCTIONS="to trigger CI , include 'run ci' in the commit message or click the 'Trigger Pipeline' button in the CircleCI UI."

            if [ ! -z "${CIRCLE_PULL_REQUEST##*/}" ]; then
              DRAFT=$(curl --silent "https://api.github.com/repos/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/pulls/${CIRCLE_PULL_REQUEST##*/}" | jq '.draft')

              if [[ "${DRAFT}" == true ]]; then
                echo "Skipping CI; PR is in draft - $TRIGGER_INSTRUCTIONS"
              fi

              echo "Always run CI for PR that is ready for review."
              exit 0
            fi

            echo "Skipping CI; branch in progress - $TRIGGER_INSTRUCTIONS"
            cancel_build
  persist_cache_to_workspace_and_exit_early:
    steps:
      - run:
          name: Check cache status and exit early if needed
          command: |
            if [[ -d ".circleci/packed" ]] && [[ "$(ls -A .circleci/packed 2>/dev/null)" ]] && [[ << pipeline.parameters.force-pack >> == false ]]; then
              echo "📦 Cache hit - packed configurations exist and force-pack is false"
              echo "✅ Persisting packed configurations to workspace and halting job"
              echo "CACHE_HIT=true" >> $BASH_ENV
            else
              echo "📦 Cache miss or force-pack is true - continuing with packaging"
              echo "CACHE_HIT=false" >> $BASH_ENV
              mkdir -p .circleci/packed # persist empty dir to workspace
            fi
      - persist_to_workspace: &persist_packed_configs
          root: .
          paths:
            - .circleci/packed
      - end-job:
          command: |
            if [[ "$CACHE_HIT" == "true" ]]; then
              echo "✅ Cache hit - packed configurations exist and force-pack is false"
              exit 0
            else
              echo "📦 Cache miss or force-pack is true - continuing with packaging"
            fi

  pack-workflows:
    steps:
      - run:
          name: Pack workflows
          command: |
            src_dir="./.circleci/src"
            outdir="./.circleci/packed"

            # Create the output directory if it doesn't exist
            mkdir -p "$outdir"

            for cfg_path in "${src_dir}"/*/; do
                cfg_name=$(basename "$cfg_path")
                output_file="${outdir}/${cfg_name}.yml"
                echo "📦 Packing ${cfg_name}.yml configuration..."
                if ! circleci config pack "$cfg_path" > "$output_file"; then
                    echo "  ❌ Failed to pack ${output_file}"
                    exit 1
                fi
            done

jobs:
  launch-primary-workflow:
      docker:
          - image: cimg/base:stable
      resource_class: small
      steps:
          - halt-early
          - attach_workspace:
              at: ~/
          - run:
              name: Check for primary workflow definition
              command: |
                if [ ! -f .circleci/workflows.yml ]; then
                    echo "❌ Primary workflow definition not found!"
                    exit 1
                fi
          - continuation/continue:
              configuration_path: .circleci/workflows.yml


  pack-workflows:
    docker:
        - image: cimg/base:stable
    resource_class: small
    steps:
        - halt-early
        - restore_cache:
            keys:
              - circleci-packed-pipelines-{{ .Revision }}
            paths:
                - ~/.circleci/packed
        - persist_cache_to_workspace_and_exit_early
        - checkout:
            at: ~/
        - restore_cache:
            keys:
              - circleci-packed-pipelines-{{ checksum ".circleci/src/**/*.yml" }}
            paths:
                - ~/.circleci/packed
        - persist_cache_to_workspace_and_exit_early
        - run: # this should only run if: the cache wass not restored OR forece_pack is true
            name: Pack configurations
            command: |
              if [[ -z "$CACHE_HIT" ]]; then
                echo "📦 Cache miss - packing configurations"
                echo "CACHE_HIT=false" >> $BASH_ENV
              fi

              for dir in ./.circleci/src/*/; do
                if [ -d "$dir" ]; then
                  dirname=$(basename "$dir")
                  output_file="./.circleci/${dirname}.yml"
                  
                  echo "📦 Packing ${dirname}.yml configuration..."
                  if ! circleci config pack "$dir" > "$output_file"; then
                    echo "  ❌ Failed to pack ${output_file}"
                    exit 1
                  fi
                  echo "  ✅ Packed ${output_file}"
                  
                  echo "  🔍 Validating ${output_file}"
                  if ! circleci config validate "$output_file"; then
                    echo "    ❌ Validating ${output_file} failed"
                    exit 1
                  fi
                  echo "    ✅ ${dirname}.yml configuration validated successfully"
                  
                  git add "$output_file"
                  echo "  📝 ${output_file} staged for commit"
                fi
              done
        - save_cache:
            keys: 
              - circleci-packed-pipelines-{{ checksum ".circleci/src/**/*.yml" }}
              - circleci-packed-pipelines-{{ .Revision }}
            paths:
                - .circleci/packed
        - persist_to_workspace: *persist_packed_configs



