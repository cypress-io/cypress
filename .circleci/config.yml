version: 2.1

# TEMPORARY (kellen/windows-self-hosted-test only, never merge): replaces the
# setup/continuation pipeline with one job on the self-hosted Windows runner
# test pool, to verify "Rerun job with SSH".

jobs:
  windows-runner-ssh-test:
    machine: true
    resource_class: cypress-io/windows-runner-test
    steps:
      - run:
          name: Show which runner picked this up
          shell: powershell.exe
          command: |
            $t = Invoke-RestMethod -Method PUT -Uri http://169.254.169.254/latest/api/token -Headers @{ "X-aws-ec2-metadata-token-ttl-seconds" = "60" }
            "Instance: " + (Invoke-RestMethod -Uri http://169.254.169.254/latest/meta-data/instance-id -Headers @{ "X-aws-ec2-metadata-token" = $t })
            "Host: $env:COMPUTERNAME  User: $env:USERNAME"
      - run:
          name: Fail on purpose
          shell: powershell.exe
          command: exit 1

workflows:
  windows-runner-ssh-test:
    jobs:
      - windows-runner-ssh-test
