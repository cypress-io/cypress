orbs:
    continuation: circleci/continuation@1.1.0
    circleci-cli: circleci/circleci-cli@0.1.9
    path-filtering: circleci/path-filtering@3.0.0
setup: true
version: 2.1

parameters:
  publish-binary-branch:
    type: string
    default: main
  force-persist-artifacts:
    type: boolean
    default: false
  # Set to true from the CircleCI "Trigger Pipeline" UI to bypass path
  # filtering and run every conditional job regardless of the diff.
  run-all-jobs:
    type: boolean
    default: false

# Two setup workflows select which continuation strategy runs:
#   - setup-workflow-full       — develop/release/force-persist/manual "run all"
#                                 paths continue directly with run-all-jobs=true.
#   - setup-workflow-filtered   — PR path uses the path-filtering orb to diff
#                                 against develop and set run-* parameters.
workflows:
    setup-workflow-full:
        when:
            or:
                - equal: [develop, << pipeline.git.branch >>]
                - equal: ['update-v8-snapshot-cache-on-develop', << pipeline.git.branch >>]
                - matches:
                    pattern: /^release\//
                    value: << pipeline.git.branch >>
                - equal: [true, << pipeline.parameters.force-persist-artifacts >>]
                - equal: [true, << pipeline.parameters.run-all-jobs >>]
        jobs:
            - pack-workflows
            - launch-primary-workflow:
                requires:
                    - pack-workflows

    setup-workflow-filtered:
        when:
            and:
                - not:
                    equal: [develop, << pipeline.git.branch >>]
                - not:
                    equal: ['update-v8-snapshot-cache-on-develop', << pipeline.git.branch >>]
                - not:
                    matches:
                        pattern: /^release\//
                        value: << pipeline.git.branch >>
                - not:
                    equal: [true, << pipeline.parameters.force-persist-artifacts >>]
                - not:
                    equal: [true, << pipeline.parameters.run-all-jobs >>]
        jobs:
            - pack-workflows
            # Draft-PR cancellation is handled by pack-workflows above; if that
            # job halts (draft PR, non-PR build), this job never starts.
            # The orb's built-in steps run checkout first, then attach the
            # workspace at workspace_path (bringing in .circleci/packed/ from
            # pack-workflows). Do NOT add a pre-step attach_workspace here —
            # it would populate /home/circleci/project before checkout and
            # cause "directory is not empty and not a git repository".
            - path-filtering/filter:
                name: launch-path-filtered-workflow
                requires:
                    - pack-workflows
                base-revision: develop
                mapping: .circleci/path-filter-mapping.conf
                config-path: .circleci/packed/pipeline.yml
                workspace_path: .

commands:
  persist:
    steps:
      - persist_to_workspace:
          root: .
          paths:
            - .circleci/packed
  persist-to-workspace-and-exit-early:
    steps:
      - run:
          name: Check cache status and exit early if needed
          command: |
            if [[ -d ".circleci/packed" ]] && [[ "$(ls -A .circleci/packed 2>/dev/null)" ]]; then
              echo "📦 Cache hit - packed configurations exist"
              echo "✅ Persisting packed configurations to workspace and halting job"
              echo "CACHE_HIT=true" >> $BASH_ENV
            else
              echo "📦 Cache miss - continuing with packaging"
              echo "CACHE_HIT=false" >> $BASH_ENV
              mkdir -p .circleci/packed # persist empty dir to workspace
            fi
      - persist
      - run:
          name: End job if cache hit
          command: |
            if [[ "$CACHE_HIT" == "true" ]] && [[ "$(ls -A .circleci/packed 2>/dev/null)" ]]; then
              echo "✅ Cache hit - packed configurations exist"
              circleci-agent step halt
            else
              echo "📦 Cache miss - continuing with packaging"
            fi
  pack-workflows:
    steps:
      - circleci-cli/install
      - run:
          name: Pack workflows
          command: |
            ./scripts/pack-ci.sh --all
  validate-workflows:
    steps:
      - run:
          name: Validate workflows
          command: |
            ./scripts/pack-ci.sh --validate --pack=false

  # Retrieving and saving packed workflows based on the checksum of the hash
  # of the yml files in ./.circleci/src
  calc-src-checksum:
    steps:
      - run:
          name: Generate config checksum for cache lookup
          # this is saved to a file, so that we can use {{ checksum }} - which
          # can only operate on the contents of a single file, not a list of
          # files or a directory.
          command: |
            find .circleci/src -name "*.yml" -type f | \
              sort | \
              xargs cat | \
              md5sum | \
              cut -d' ' -f1 > /tmp/config_checksum.txt
  restore-src-checksum-cache:
    steps:
      - calc-src-checksum
      - restore_cache:
            keys:
              - circleci-packed-pipelines-{{ checksum "/tmp/config_checksum.txt" }}
            paths:
                - .circleci/packed
  save-src-checksum-cache:
    steps:
      - calc-src-checksum
      - save_cache:
          key: circleci-packed-pipelines-{{ checksum "/tmp/config_checksum.txt" }}
          paths:
            - .circleci/packed

  cancel-draft-prs:
    steps:
      - when:
          condition:
            not:
              or:
                - equal: [<<pipeline.trigger_source>>, 'api']
                - equal: [<<pipeline.git.branch>>, 'develop']
                - matches:
                    pattern: /^release\/.*/
                    value: <<pipeline.git.branch>>
          steps:
            - run:
                name: Cancel CI
                command: |
                  cancel_build() {
                    circleci-agent step halt
                  }

                  if [ ! -z "${CIRCLE_PULL_REQUEST##*/}" ]; then
                    DRAFT=$(curl --silent "https://api.github.com/repos/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/pulls/${CIRCLE_PULL_REQUEST##*/}" | jq '.draft')

                    if [[ "${DRAFT}" == true ]]; then
                      echo "Skipping CI; PR is in draft - to trigger CI , click the 'Trigger Pipeline' button in the CircleCI UI."
                      cancel_build
                    fi

                    echo "Always run CI for PR that is ready for review."
                    exit 0
                  fi

                  # otherwise, the build is not a PR so we cancel it 
                  cancel_build

jobs:
  pack-workflows:
    docker:
        - image: cimg/base:stable
    resource_class: small
    steps:
        - cancel-draft-prs
        - checkout:
            method: blobless
        - restore-src-checksum-cache
        - persist-to-workspace-and-exit-early
        - pack-workflows
        - save-src-checksum-cache
        - persist

  launch-primary-workflow:
      docker:
          - image: cimg/base:stable
      resource_class: small
      steps:
          - cancel-draft-prs
          - attach_workspace:
              at: .
          - run:
              name: Check for primary workflow definition
              command: |
                if [ ! -f .circleci/packed/pipeline.yml ]; then
                    echo "❌ Primary workflow definition not found in .circleci/packed/pipeline.yml!"
                    exit 1
                fi
          - run:
              name: Build continuation parameters (run-all path)
              environment:
                  PUBLISH_BINARY_BRANCH: << pipeline.parameters.publish-binary-branch >>
                  FORCE_PERSIST_ARTIFACTS: << pipeline.parameters.force-persist-artifacts >>
              command: |
                # In the full path, every conditional job must run, so force
                # run-all-jobs=true in the continued pipeline. publish-binary-branch
                # and force-persist-artifacts are passed through verbatim.
                cat > /tmp/pipeline-parameters.json <<EOF
                {
                  "publish-binary-branch": "${PUBLISH_BINARY_BRANCH}",
                  "force-persist-artifacts": ${FORCE_PERSIST_ARTIFACTS},
                  "run-all-jobs": true
                }
                EOF
                cat /tmp/pipeline-parameters.json
          - continuation/continue:
              configuration_path: .circleci/packed/pipeline.yml
              parameters: /tmp/pipeline-parameters.json
