version: 2.1

executors:
  cy:
    docker:
      - image: cypress/base-internal:24.15.0-trixie
    resource_class: medium.gen2

commands:
  pnpm-setup:
    steps:
      - run: npm i -g pnpm@9.15.9
      - run: node .circleci/exp/pnpm-prep.js
      - run: pnpm import 2>&1 | tail -3

  rec-pnpm-setup:
    steps:
      - run: node .circleci/exp/pnpm-prep.js
      - run:
          name: Install pnpm package manager (recommended installer)
          command: |
            curl -fsSL https://get.pnpm.io/install.sh | SHELL=bash sh -
            echo 'export PATH="$PNPM_HOME/bin:$PNPM_HOME:$PATH"' >> "$BASH_ENV"
            export PATH="$PNPM_HOME/bin:$PNPM_HOME:$PATH"
            pnpm --version
            pnpm config set store-dir .pnpm-store
      - run: pnpm import 2>&1 | tail -3

  win-pnpm-setup:
    steps:
      - run:
          name: Install Node (ensure-node.sh)
          command: source ./scripts/ensure-node.sh && node -v
      - run: node .circleci/exp/pnpm-prep.js
      - run:
          name: Install pnpm
          command: |
            npm i -g pnpm@12.9.1
            pnpm -v
            pnpm config set store-dir .pnpm-store
      - run: pnpm import 2>&1 | tail -3

jobs:
  prep-yarn:
    executor: cy
    steps:
      - checkout
      - run: cd ~ && npm i glob@7.1.6 fs-extra@10.0.0 minimist@1.2.5 fast-json-stable-stringify@2.1.0
      - run:
          command: PERCY_POSTINSTALL_BROWSER=true yarn --prefer-offline --frozen-lockfile --ignore-scripts --cache-folder ~/.yarn
          no_output_timeout: 20m
      - run: |
          node scripts/circle-cache.js --action prepare
          mkdir -p /tmp/node_modules_cache
          mv node_modules /tmp/node_modules_cache/root_node_modules
          mv cli/node_modules /tmp/node_modules_cache/cli_node_modules
          mv system-tests/node_modules /tmp/node_modules_cache/system-tests_node_modules
          mv globbed_node_modules /tmp/node_modules_cache/globbed_node_modules
          du -sh /tmp/node_modules_cache
      - save_cache:
          key: exp-yarn-nm-v1-<< pipeline.number >>
          paths: [/tmp/node_modules_cache]

  prep-pnpm:
    executor: cy
    steps:
      - checkout
      - pnpm-setup
      - run:
          command: pnpm install --frozen-lockfile --ignore-scripts --store-dir ~/.pnpm-store
          no_output_timeout: 20m
      - run: du -sh ~/.pnpm-store node_modules
      - save_cache:
          key: exp-pnpm-store-v1-<< pipeline.number >>
          paths: [~/.pnpm-store]
      - run: |
          ls -d node_modules cli/node_modules system-tests/node_modules scripts/node_modules packages/*/node_modules npm/*/node_modules tooling/*/node_modules 2>/dev/null > /tmp/nm_paths
          mkdir -p /tmp/pnpm_linked
          tar cf - -T /tmp/nm_paths | tar xf - -C /tmp/pnpm_linked
          du -sh /tmp/pnpm_linked
      - save_cache:
          key: exp-pnpm-linked-v1-<< pipeline.number >>
          paths: [/tmp/pnpm_linked]

  measure-yarn:
    parameters: {n: {type: integer}}
    executor: cy
    steps:
      - checkout
      - restore_cache:
          name: TIMED yarn node_modules restore
          key: exp-yarn-nm-v1-<< pipeline.number >>
      - run:
          name: TIMED yarn unpack
          command: |
            cd ~ && npm i glob@7.1.6 fs-extra@10.0.0 minimist@1.2.5 fast-json-stable-stringify@2.1.0 >/dev/null
            cd ~/project
            mv /tmp/node_modules_cache/root_node_modules node_modules
            mv /tmp/node_modules_cache/cli_node_modules cli/node_modules
            mv /tmp/node_modules_cache/system-tests_node_modules system-tests/node_modules
            mv /tmp/node_modules_cache/globbed_node_modules globbed_node_modules
            node scripts/circle-cache.js --action unpack

  measure-pnpm-store:
    parameters: {n: {type: integer}}
    executor: cy
    steps:
      - checkout
      - pnpm-setup
      - restore_cache:
          name: TIMED pnpm store restore
          key: exp-pnpm-store-v1-<< pipeline.number >>
      - run:
          name: TIMED pnpm offline link
          command: pnpm install --offline --frozen-lockfile --ignore-scripts --store-dir ~/.pnpm-store

  measure-pnpm-linked:
    parameters: {n: {type: integer}}
    executor: cy
    steps:
      - checkout
      - restore_cache:
          name: TIMED pnpm linked node_modules restore
          key: exp-pnpm-linked-v1-<< pipeline.number >>
      - run:
          name: TIMED pnpm linked unpack
          command: |
            cd /tmp/pnpm_linked
            find . -name node_modules -prune -print | while read p; do mkdir -p ~/project/$(dirname $p); mv $p ~/project/$p; done
            du -sh ~/project/node_modules

  prep-old-store:
    parameters: {sha: {type: string}, label: {type: string}}
    executor: cy
    steps:
      - checkout
      - run: npm i -g pnpm@9.15.9
      - run:
          name: Build store from << parameters.label >> lockfile (<< parameters.sha >>)
          command: |
            mkdir ~/old && git archive << parameters.sha >> | tar -x -C ~/old
            cp -r .circleci/exp ~/old/.circleci/
            cd ~/old && node .circleci/exp/pnpm-prep.js && pnpm import 2>&1 | tail -2
            pnpm install --frozen-lockfile --ignore-scripts --store-dir ~/.pnpm-store
            du -sh ~/.pnpm-store
      - save_cache:
          key: exp-pnpm-oldstore-<< parameters.label >>-v1-<< pipeline.number >>
          paths: [~/.pnpm-store]

  warm-prep:
    parameters: {label: {type: string}, n: {type: integer}}
    executor: cy
    steps:
      - checkout
      - pnpm-setup
      - restore_cache:
          name: TIMED restore previous store
          key: exp-pnpm-oldstore-<< parameters.label >>-v1-<< pipeline.number >>
      - run:
          name: TIMED pnpm install (online, warm store)
          command: pnpm install --frozen-lockfile --ignore-scripts --store-dir ~/.pnpm-store --reporter=append-only --loglevel=info 2>&1 | grep -v "cyclic workspace" | grep -iE "progress|reused|downloaded|import|hard ?link|copied|cloned|added|Done|ERR" | tail -15
      - run:
          name: TIMED pnpm store prune
          command: pnpm store prune --store-dir ~/.pnpm-store 2>&1 | tail -3; du -sh ~/.pnpm-store
      - save_cache:
          name: TIMED save store
          key: exp-pnpm-warmstore-<< parameters.label >>-<< parameters.n >>-v1-<< pipeline.number >>
          paths: [~/.pnpm-store]

  import-diag:
    parameters: {n: {type: integer}}
    executor: cy
    steps:
      - checkout
      - pnpm-setup
      - restore_cache:
          name: restore exact store (from pipeline 86833)
          key: exp-pnpm-store-v1-86833
      - run:
          name: filesystem facts
          command: |
            stat -c 'dev=%d %n' ~/.pnpm-store ~/project /tmp
            df -h ~/.pnpm-store ~/project | cat
            find ~/.pnpm-store -type f | awk 'NR<=2000' | xargs stat -c %h | sort | uniq -c
      - run:
          name: TIMED link auto
          command: |
            pnpm install --offline --frozen-lockfile --ignore-scripts --store-dir ~/.pnpm-store --reporter=append-only --loglevel=info 2>&1 | { grep -v cyclic || true; } | { grep -iE "import|link|cop|clon|Done" || true; } | tail -5
            echo "nlink of node_modules/.pnpm files:"; find node_modules/.pnpm -type f | awk 'NR<=2000' | xargs stat -c %h | sort | uniq -c
      - run: rm -rf node_modules */node_modules packages/*/node_modules npm/*/node_modules tooling/*/node_modules
      - run:
          name: TIMED link hardlink
          command: |
            pnpm install --offline --frozen-lockfile --ignore-scripts --store-dir ~/.pnpm-store --package-import-method=hardlink 2>&1 | { grep -v cyclic || true; } | tail -3
            echo "nlink:"; find node_modules/.pnpm -type f | awk 'NR<=2000' | xargs stat -c %h | sort | uniq -c
      - run: rm -rf node_modules */node_modules packages/*/node_modules npm/*/node_modules tooling/*/node_modules
      - run:
          name: TIMED link copy
          command: pnpm install --offline --frozen-lockfile --ignore-scripts --store-dir ~/.pnpm-store --package-import-method=copy 2>&1 | { grep -v cyclic || true; } | tail -3
      - run:
          name: TIMED link hardlink no-verify
          command: |
            rm -rf node_modules */node_modules packages/*/node_modules npm/*/node_modules tooling/*/node_modules
            pnpm install --offline --frozen-lockfile --ignore-scripts --store-dir ~/.pnpm-store --package-import-method=hardlink --config.verify-store-integrity=false 2>&1 | { grep -v cyclic || true; } | tail -3

  rec-prep:
    executor: cy
    environment: {PNPM_HOME: /root/.local/share/pnpm}
    steps:
      - checkout
      - rec-pnpm-setup
      - run:
          command: pnpm install --ignore-scripts
          no_output_timeout: 20m
      - run: pnpm store path; du -sh .pnpm-store
      - save_cache:
          key: rec-pnpm-packages-{{ checksum "pnpm-lock.yaml" }}-<< pipeline.number >>
          paths: [.pnpm-store]

  rec-measure:
    parameters: {n: {type: integer}}
    executor: cy
    environment: {PNPM_HOME: /root/.local/share/pnpm}
    steps:
      - checkout
      - rec-pnpm-setup
      - restore_cache:
          name: TIMED Restore pnpm Package Cache
          keys:
            - rec-pnpm-packages-{{ checksum "pnpm-lock.yaml" }}-<< pipeline.number >>
      - run:
          name: config facts
          command: |
            pnpm store path
            pnpm config get package-import-method
            stat -c 'dev=%d %n' .pnpm-store . 
      - run:
          name: TIMED pnpm install (auto)
          command: |
            pnpm install --ignore-scripts 2>&1 | { grep -v cyclic || true; } | tail -3
            echo "nlink:"; find node_modules/.pnpm -type f | awk 'NR<=2000' | xargs stat -c %h | sort -n | uniq -c | sort -rn | head -4
      - run: rm -rf node_modules */node_modules packages/*/node_modules npm/*/node_modules tooling/*/node_modules
      - run:
          name: TIMED pnpm install (forced hardlink)
          command: |
            pnpm install --ignore-scripts --package-import-method=hardlink 2>&1 | { grep -v cyclic || true; } | tail -3
            echo "nlink:"; find node_modules/.pnpm -type f | awk 'NR<=2000' | xargs stat -c %h | sort -n | uniq -c | sort -rn | head -4
      - save_cache:
          name: TIMED Save pnpm Package Cache (should skip, key exists)
          key: rec-pnpm-packages-{{ checksum "pnpm-lock.yaml" }}-<< pipeline.number >>
          paths: [.pnpm-store]

  win-prep-pnpm:
    machine:
      image: windows-server-2022-gui:stable
      shell: bash.exe -eo pipefail
    resource_class: windows.large
    environment: {PLATFORM: windows}
    steps:
      - checkout
      - win-pnpm-setup
      - run:
          name: TIMED pnpm install (cold)
          command: pnpm install --ignore-scripts 2>&1 | tail -3
          no_output_timeout: 30m
      - run:
          name: facts
          command: |
            pnpm store path
            du -sh .pnpm-store node_modules || true
            node .circleci/exp/win-facts.js
      - save_cache:
          name: Save pnpm store
          key: win-pnpm-store-v1-<< pipeline.number >>
          paths: [.pnpm-store]
      - save_cache:
          name: PROBE save linked root node_modules (expect link warnings)
          key: win-pnpm-linked-probe-v1-<< pipeline.number >>
          paths: [node_modules]

  win-measure-pnpm:
    parameters: {n: {type: integer}}
    machine:
      image: windows-server-2022-gui:stable
      shell: bash.exe -eo pipefail
    resource_class: windows.large
    environment: {PLATFORM: windows}
    steps:
      - checkout
      - win-pnpm-setup
      - restore_cache:
          name: TIMED restore pnpm store
          key: win-pnpm-store-v1-<< pipeline.number >>
      - run:
          name: TIMED pnpm install (warm store)
          command: pnpm install --ignore-scripts 2>&1 | tail -3
      - run:
          name: facts
          command: node .circleci/exp/win-facts.js

workflows:
  windows-pnpm:
    jobs:
      - win-prep-pnpm
      - win-measure-pnpm:
          requires: [win-prep-pnpm]
          matrix: {parameters: {n: [1, 2, 3]}}
